/* ── 12. МАЛЮВАННЯ: ТЛО ──────────────────────────────────── */
function drawSky(){
  const th = G.theme;
  const gr = ctx.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0, th.sky[0]); gr.addColorStop(1, th.sky[1]);
  ctx.fillStyle = gr; ctx.fillRect(0,0,VW,VH);

  // далекі пагорби / кристали
  const p1 = -G.cam.x*.22;
  ctx.fillStyle = th.hill2;
  for(let i=-1;i<14;i++){
    const x = ((i*150 + p1) % (14*150) + 14*150) % (14*150) - 150;
    ctx.beginPath(); ctx.moveTo(x-70, VH); ctx.lineTo(x, VH-96); ctx.lineTo(x+70, VH); ctx.fill();
  }
  const p2 = -G.cam.x*.42;
  ctx.fillStyle = th.hill;
  for(let i=-1;i<18;i++){
    const x = ((i*110 + p2) % (18*110) + 18*110) % (18*110) - 110;
    ctx.beginPath(); ctx.moveTo(x-58, VH); ctx.lineTo(x, VH-62); ctx.lineTo(x+58, VH); ctx.fill();
  }
  // хмари / сталактити
  ctx.fillStyle = th.cloud; ctx.globalAlpha = G.meta.theme===0?.95:.5;
  const p3 = -G.cam.x*.14;
  for(let i=0;i<10;i++){
    const x = ((i*180 + p3) % 1800 + 1800) % 1800 - 120;
    const y = 26 + (i%4)*30;
    if(G.meta.theme===1){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+16,0); ctx.lineTo(x+8,44+(i%3)*18); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(x,y+3,13,0,7); ctx.arc(x+17,y-5,18,0,7); ctx.arc(x+36,y+3,14,0,7);
      ctx.ellipse(x+18,y+9,26,7,0,0,7);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // блискавки на 3-му рівні
  if(G.meta.theme===2 && (G.frames%211)<6){
    ctx.fillStyle = 'rgba(255,255,255,'+(.20-(G.frames%211)*.03)+')';
    ctx.fillRect(0,0,VW,VH);
  }
}

/* ── 13. МАЛЮВАННЯ: ТАЙЛИ ────────────────────────────────── */
function drawTiles(){
  const th = G.theme;
  const x0 = Math.max(0, Math.floor(G.cam.x/T)-4), x1 = Math.min(G.W-1, Math.ceil((G.cam.x+VW)/T)+4);
  for(let y=0;y<G.H;y++){
    for(let x=x0;x<=x1;x++){
      const c = G.grid[y][x];
      if(c==='.') continue;
      let px = x*T, py = y*T;
      const bump = G.bumps.find(b=>b.x===x&&b.y===y);
      if(bump) py -= Math.sin((12-bump.t)/12*Math.PI)*7;
      drawTile(c, px, py, x, y, th);
    }
  }
}
function drawTile(c,px,py,tx,ty,th){
  switch(c){
    case '#': {
      const top = ty>0 && !isSolid(G.grid[ty-1][tx]);
      ctx.fillStyle = th.dirt; ctx.fillRect(px,py,T,T);
      ctx.fillStyle = th.dirt2;
      ctx.fillRect(px+3,py+8,3,3); ctx.fillRect(px+12,py+13,3,3); ctx.fillRect(px+8,py+4,2,2);
      if(top){
        ctx.fillStyle = th.grass; ctx.fillRect(px,py,T,7);
        ctx.fillStyle = th.grassTop; ctx.fillRect(px,py,T,3);
      }
      ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=1;
      ctx.strokeRect(px+.5,py+.5,T-1,T-1);
      break; }
    case 'X': case 'W': {
      ctx.fillStyle = th.stone; ctx.fillRect(px,py,T,T);
      ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(px,py,T,3); ctx.fillRect(px,py,3,T);
      ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(px,py+T-3,T,3); ctx.fillRect(px+T-3,py,3,T);
      break; }
    case 'B': {
      ctx.fillStyle = th.brick; ctx.fillRect(px,py,T,T);
      ctx.fillStyle = 'rgba(0,0,0,.32)';
      ctx.fillRect(px,py+9,T,2); ctx.fillRect(px,py+19,T,1);
      ctx.fillRect(px+9,py,2,9); ctx.fillRect(px+4,py+11,2,9); ctx.fillRect(px+15,py+11,2,9);
      ctx.fillStyle='rgba(255,255,255,.16)'; ctx.fillRect(px,py,T,2);
      break; }
    case '?': case '!': case '%': {
      const pulse = 1 + Math.sin(G.frames*.12 + tx)*.12;
      ctx.fillStyle = '#e6a91c'; ctx.fillRect(px,py,T,T);
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(px+2,py+2,T-4,T-4);
      ctx.fillStyle = 'rgba(255,255,255,'+(.3*pulse)+')'; ctx.fillRect(px+2,py+2,T-4,4);
      ctx.fillStyle = '#7a4a05';
      ctx.font = 'bold 14px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('?', px+T/2, py+T/2+1);
      ctx.fillStyle='#7a4a05';
      [[3,3],[15,3],[3,15],[15,15]].forEach(o=>ctx.fillRect(px+o[0],py+o[1],2,2));
      break; }
    case 'M': {
      ctx.fillStyle = '#8a6a2f'; ctx.fillRect(px,py,T,T);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(px+2,py+2,T-4,T-4);
      ctx.fillStyle='#6b4f1f';
      [[3,3],[15,3],[3,15],[15,15]].forEach(o=>ctx.fillRect(px+o[0],py+o[1],2,2));
      break; }
    case '-': {
      ctx.fillStyle = '#c98a12'; ctx.fillRect(px,py,T,6);
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(px,py,T,3);
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(px,py+6,T,2);
      break; }
    case '^': {
      ctx.fillStyle = '#d9dbe8';
      for(let i=0;i<3;i++){
        ctx.beginPath(); ctx.moveTo(px+i*7, py+T); ctx.lineTo(px+i*7+3.5, py+7); ctx.lineTo(px+i*7+7, py+T); ctx.fill();
      }
      ctx.fillStyle='#7c8098'; ctx.fillRect(px,py+T-4,T,4);
      break; }
    case 'L': {
      const w = Math.sin(G.frames*.09 + tx*.6)*3;
      ctx.fillStyle = '#ff6a2b'; ctx.fillRect(px,py+4+w,T,T-4-w);
      ctx.fillStyle = '#ffb03a'; ctx.fillRect(px,py+4+w,T,4);
      ctx.fillStyle = 'rgba(255,220,120,.5)'; ctx.fillRect(px+4,py+7+w,4,3);
      break; }
    case 'S': {
      ctx.fillStyle='#4a4f6b'; ctx.fillRect(px+2,py+12,T-4,8);
      ctx.fillStyle='#c3c8e0';
      for(let i=0;i<3;i++) ctx.fillRect(px+2,py+6+i*4,T-4,2);
      ctx.fillStyle='#ffd23f'; ctx.fillRect(px+1,py+2,T-2,4);
      break; }
    case 'd': case 'U': {
      ctx.fillStyle = th.pipe; ctx.fillRect(px-3,py,T+3,T);
      ctx.fillStyle = th.pipeHi; ctx.fillRect(px-3,py+1,T+3,3);
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(px-1,py+6,T,T-6);
      ctx.fillStyle = c==='d' ? '#ffd23f' : '#5af0e0';
      const ar = Math.sin(G.frames*.12)*2;
      ctx.beginPath();
      if(c==='d'){ ctx.moveTo(px+4,py+9+ar); ctx.lineTo(px+16,py+9+ar); ctx.lineTo(px+10,py+16+ar); }
      else       { ctx.moveTo(px+4,py+16-ar); ctx.lineTo(px+16,py+16-ar); ctx.lineTo(px+10,py+9-ar); }
      ctx.closePath(); ctx.fill();
      break; }
    case '[': case ']': case '{': case '}': {
      const isTop = (c==='['||c===']'), isL = (c==='['||c==='{');
      ctx.fillStyle = th.pipe; ctx.fillRect(px,py,T,T);
      ctx.fillStyle = th.pipeHi; ctx.fillRect(px + (isL?2:T-8), py, 6, T);
      ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(px + (isL?0:T-3), py, 3, T);
      if(isTop){
        ctx.fillStyle = th.pipe; ctx.fillRect(px - (isL?3:0), py, T+3, 8);
        ctx.fillStyle = th.pipeHi; ctx.fillRect(px - (isL?3:0), py+1, T+3, 3);
        ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(px-(isL?3:0), py+8, T+3, 2);
      }
      break; }
    case 'G': {
      const top = ty>0 && G.grid[ty-1][tx]!=='G';
      ctx.fillStyle = '#cfd6ea'; ctx.fillRect(px+8,py,4,T);
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(px+8,py,1,T);
      if(top){
        const s = Math.sin(G.frames*.09)*3;
        ctx.fillStyle = '#ffd23f';
        ctx.beginPath(); ctx.moveTo(px+12,py+2); ctx.lineTo(px+12+22, py+8+s); ctx.lineTo(px+12,py+14); ctx.fill();
        ctx.fillStyle = '#5af0e0'; ctx.beginPath(); ctx.arc(px+10,py-2,5,0,7); ctx.fill();
        ctx.fillStyle = 'rgba(90,240,224,'+(.2+Math.sin(G.frames*.12)*.12)+')';
        ctx.beginPath(); ctx.arc(px+10,py-2,13,0,7); ctx.fill();
      }
      break; }
    case 'Z': {
      const s = Math.sin(G.frames*.1)*2;
      ctx.fillStyle='#8b86c9'; ctx.fillRect(px+9,py-4,2,T+4);
      ctx.fillStyle = G.spawn.x > tx*T-4 ? '#5af0e0' : '#4b429b';
      ctx.beginPath(); ctx.moveTo(px+11,py-4); ctx.lineTo(px+11+13,py+1+s); ctx.lineTo(px+11,py+6); ctx.fill();
      break; }
  }
}

/* ── 14. МАЛЮВАННЯ: ГЕРОЙ ────────────────────────────────── */
const CLR = { body:'#ffd23f', shade:'#e0a81c', dark:'#2b2118', cheek:'#ff4d4d',
              white:'#fff7e6', stripe:'#c98a12' };
const HK = .76;                       // 43 px силуету → 33 px, майже рівно хітбокс
/* Те, що видно, — те й збирає. Коробка збирання повторює силует, а не хітбокс. */
function reachBox(){
  const hs = HERO_SIZE[Math.max(0,Math.min(2,P.power))];   // збирає рівно те, що видно
  return {x:P.x-5, y:P.y+P.h-hs-4, w:P.w+10, h:hs+8};
}
const HERO_SIZE = [17, 34, 46];        // Пічу вполовину, Райчу помітно більший
/* Кожна форма має власні три кадри: Пічу → Пікачу → Райчу */
function heroFrame(){
  const c = 'c' + Math.max(0, Math.min(2, P.power));
  if(P.state==='run') return art(c+'run');
  if(P.state==='jump'||P.state==='fall') return art(c+'jump');
  return art(c+'idle');
}
function drawHero(){
  const A0 = ctx.globalAlpha;
  const img = heroFrame();
  if(img){
    for(const t of P.trail){
      ctx.globalAlpha = A0 * t.t/30;
      const ti = img, th2 = HERO_SIZE[Math.max(0,Math.min(2,P.power))], tw2 = ti.width/ti.height*th2;
      ctx.save(); ctx.translate(t.x+P.w/2, t.y+P.h);
      if(t.d<0) ctx.scale(-1,1);
      ctx.drawImage(ti, -tw2/2, -th2, tw2, th2); ctx.restore();
    }
    ctx.globalAlpha = A0 * (P.inv>0 && Math.floor(G.frames/4)%2===0 ? .35 : 1);
    const h = HERO_SIZE[Math.max(0,Math.min(2,P.power))], w = img.width/img.height*h;
    const bob = P.state==='run' ? Math.abs(Math.sin(P.anim*2))*1.2 : 0;
    ctx.save();
    ctx.translate(Math.round(P.x+P.w/2), Math.round(P.y+P.h)+1);
    if(P.dir<0) ctx.scale(-1,1);
    if(!P.alive) ctx.rotate(P.deadT*.16);
    ctx.scale(P.sx, P.sy*(P.state==='crouch'?.74:1));
    if(P.power>0){
      ctx.strokeStyle = 'rgba(90,240,224,'+(.35+Math.sin(G.frames*.25)*.2)+')';
      ctx.lineWidth = 2;
      for(let i=0;i<3;i++){
        const a2 = G.frames*.12 + i*2.1;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a2)*17, -16+Math.sin(a2)*17);
        ctx.lineTo(Math.cos(a2+1.4)*12, -16+Math.sin(a2+1.4)*12);
        ctx.lineTo(Math.cos(a2+2.6)*18, -16+Math.sin(a2+2.6)*18);
        ctx.stroke();
      }
    }
    ctx.drawImage(img, -w/2, -h - bob, w, h);
    ctx.restore();
    ctx.globalAlpha = A0;
    return;
  }
  for(const t of P.trail){
    ctx.globalAlpha = A0 * t.t/26;
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.ellipse(t.x+7, t.y+15, 6, 9, 0, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = A0;
  const blink = P.inv>0 && Math.floor(G.frames/4)%2===0;
  if(blink) ctx.globalAlpha = A0*.35;
  ctx.save();
  ctx.translate(Math.round(P.x + P.w/2), Math.round(P.y + P.h));
  if(P.dir<0) ctx.scale(-1,1);

  const run = P.state==='run';
  const leg = run ? Math.sin(P.anim*2)*4 : 0;
  const bob = run ? Math.abs(Math.sin(P.anim*2))*1.5 : Math.sin(G.frames*.06)*.8;
  const air = P.state==='jump'||P.state==='fall';
  const crouch = P.state==='crouch';
  const sq = crouch ? .72 : 1;
  ctx.scale(P.sx*HK, P.sy*sq*HK);   // HK — щоб намальований Піка збігався з тим, чим він торкається світу

  if(!P.alive){ ctx.rotate(P.deadT*.16); }

  // аура заряду
  if(P.power>0){
    ctx.strokeStyle = 'rgba(90,240,224,'+(.35+Math.sin(G.frames*.25)*.2)+')';
    ctx.lineWidth = 2;
    for(let i=0;i<3;i++){
      const a = G.frames*.12 + i*2.1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*15, -14+Math.sin(a)*15);
      ctx.lineTo(Math.cos(a+1.4)*11, -14+Math.sin(a+1.4)*11);
      ctx.lineTo(Math.cos(a+2.6)*16, -14+Math.sin(a+2.6)*16);
      ctx.stroke();
    }
  }

  // хвіст-блискавка
  const tw = Math.sin(G.frames*.14 + (run?P.anim:0))*4;
  ctx.fillStyle = CLR.body; ctx.strokeStyle = CLR.stripe; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-4,-14); ctx.lineTo(-13,-17+tw); ctx.lineTo(-9,-19+tw);
  ctx.lineTo(-17,-26+tw); ctx.lineTo(-12,-24+tw); ctx.lineTo(-16,-31+tw);
  ctx.lineTo(-5,-22); ctx.closePath(); ctx.fill(); ctx.stroke();

  // ноги
  ctx.fillStyle = CLR.body;
  const ly = air ? -4 : 0;
  rr(-6, -7+ly - (air?2:leg>0?leg:0), 6, 8+(air?-2:0), 3);
  rr( 1, -7+ly - (air?2:leg<0?-leg:0), 6, 8+(air?-2:0), 3);
  ctx.fillStyle = CLR.shade;
  rr(-6, -2+ly, 6, 3, 2); rr(1, -2+ly, 6, 3, 2);

  // тіло
  ctx.fillStyle = CLR.body;
  ctx.beginPath(); ctx.ellipse(0, -13-bob, 8, 8.5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = CLR.stripe;
  ctx.fillRect(-8, -17-bob, 5, 2); ctx.fillRect(-8, -13-bob, 5, 2);

  // рука
  ctx.fillStyle = CLR.body;
  const arm = run ? -Math.sin(P.anim*2)*3 : (air?-4:0);
  ctx.beginPath(); ctx.ellipse(6, -13-bob+arm, 3.4, 4.4, .3, 0, 7); ctx.fill();

  // голова
  ctx.fillStyle = CLR.body;
  ctx.beginPath(); ctx.ellipse(0, -23-bob, 9, 8.2, 0, 0, 7); ctx.fill();

  // вуха
  const es = Math.sin(G.frames*.07)*.1 + (air? .25:0);
  for(const [ex, sgn] of [[-4,-1],[4.5,1]]){
    ctx.save(); ctx.translate(ex, -29-bob); ctx.rotate(sgn*(.32+es));
    ctx.fillStyle = CLR.body;
    ctx.beginPath(); ctx.ellipse(0,-6,2.8,8,0,0,7); ctx.fill();
    ctx.fillStyle = CLR.dark;
    ctx.beginPath(); ctx.ellipse(0,-12,2.6,3.2,0,0,7); ctx.fill();
    ctx.restore();
  }

  // щоки
  ctx.fillStyle = CLR.cheek;
  ctx.beginPath(); ctx.arc(-6,-21-bob,3.1,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(6.5,-21-bob,3.1,0,7); ctx.fill();
  if(P.power>0){
    ctx.fillStyle='rgba(255,255,255,'+(.3+Math.sin(G.frames*.4)*.3)+')';
    ctx.beginPath(); ctx.arc(-6,-21-bob,1.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(6.5,-21-bob,1.6,0,7); ctx.fill();
  }

  // очі
  ctx.fillStyle = CLR.dark;
  const eh = (!P.alive) ? 1 : 3;
  ctx.beginPath(); ctx.ellipse(-3.6,-25-bob,2.4,eh,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4,-25-bob,2.4,eh,0,0,7); ctx.fill();
  if(P.alive){
    ctx.fillStyle = CLR.white;
    ctx.beginPath(); ctx.arc(-3,-26-bob,.9,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(4.6,-26-bob,.9,0,7); ctx.fill();
  }
  // рот
  ctx.strokeStyle = CLR.dark; ctx.lineWidth = 1.2; ctx.beginPath();
  if(air||run){ ctx.arc(.5,-21.5-bob,2.4,.15,2.99); }
  else { ctx.moveTo(-2,-20.5-bob); ctx.quadraticCurveTo(.5,-19.2-bob,3,-20.5-bob); }
  ctx.stroke();
  // ніс
  ctx.fillStyle = CLR.dark; ctx.fillRect(0,-23-bob,1.6,1.2);

  ctx.restore();
  ctx.globalAlpha = A0;
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();
}

/* ── 15. МАЛЮВАННЯ: ВОРОГИ ТА ПРЕДМЕТИ ───────────────────── */
/* Ворог малюється ілюстрацією; хітбокс лишається меншим — так чесніше до гравця */
function drawFoe(e, key, h, spin){
  const img = art(key), w = img.width/img.height*h;
  ctx.save();
  ctx.translate(e.w/2, e.h);
  if(e.squash>0){ ctx.scale(1, .28); }
  else if(spin){ ctx.rotate(Math.sin(G.frames*.02)*.25); }
  else if(e.dir<0) ctx.scale(-1,1);
  const fl = (e.t==='flyer') ? Math.sin(e.anim*1.6)*2 : 0;
  if(e.swift){                                  // швидкий — зі слідом
    ctx.fillStyle = 'rgba(255,210,63,.45)';
    for(let k=1;k<=3;k++) ctx.fillRect(w/2 + k*4, -h*0.62 + k*3, 6, 2);
  }
  ctx.drawImage(img, -w/2, -h + fl, w, h);
  ctx.restore();
}
function drawEnts(){
  for(const e of G.ents){
    const sx = e.x, sy = e.y;
    if(sx > G.cam.x+VW+40 || sx+e.w < G.cam.x-40) continue;
    ctx.save(); ctx.translate(Math.round(sx), Math.round(sy));

    if(e.t==='berry'){
      const b = Math.sin(e.a)*2;
      ctx.fillStyle='#5af0e0';
      ctx.beginPath(); ctx.arc(6,6+b,5,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.arc(4,4+b,1.8,0,7); ctx.fill();
      ctx.strokeStyle='#2a7f78'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(6,1+b); ctx.lineTo(8,-2+b); ctx.stroke();
    }
    else if(e.t==='relic'){
      const pu = Math.sin(e.a)*3, gl = .5+Math.sin(e.a*2)*.5;
      ctx.save(); ctx.translate(7, 7+pu); ctx.rotate(e.a*.3);
      ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(255,210,63,'+gl+')';
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      for(let q=0;q<12;q++){ const an=q/12*Math.PI*2, r2=q%2?4:9;
        if(q) ctx.lineTo(Math.cos(an)*r2, Math.sin(an)*r2); else ctx.moveTo(Math.cos(an)*r2, Math.sin(an)*r2); }
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#fff7e6';
      ctx.beginPath(); ctx.arc(0,0,2.6,0,7); ctx.fill();
      ctx.restore();
    }
    else if(e.t==='item'){
      if(e.kind==='charge'){
        const p = .5+Math.sin(G.frames*.2)*.5;
        ctx.fillStyle='#ffd23f';
        ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(3,9); ctx.lineTo(8,9);
        ctx.lineTo(4,16); ctx.lineTo(14,6); ctx.lineTo(9,6); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,'+p+')'; ctx.lineWidth=1; ctx.stroke();
      } else {
        ctx.fillStyle='#ff4d4d';
        ctx.beginPath(); ctx.arc(5,6,4.5,0,7); ctx.arc(11,6,4.5,0,7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(1,7); ctx.lineTo(8,15); ctx.lineTo(15,7); ctx.fill();
      }
    }
    else if(e.t==='bolt'){
      ctx.fillStyle='#fff7e6';
      ctx.beginPath(); ctx.moveTo(0,3); ctx.lineTo(6,0); ctx.lineTo(4,3); ctx.lineTo(10,3);
      ctx.lineTo(4,6); ctx.lineTo(6,3); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(90,240,224,.6)';
      ctx.fillRect(-6*Math.sign(e.vx),2,6,2);
    }
    else if(e.t==='plat'){
      ctx.fillStyle='#4b429b'; ctx.fillRect(0,0,e.w,9);
      ctx.fillStyle='#8b86c9'; ctx.fillRect(0,0,e.w,3);
      ctx.fillStyle='#5af0e0';
      for(let i=6;i<e.w;i+=14) ctx.fillRect(i,4,3,2);
    }
    else if(e.t==='dog'){
      const run = Math.sin(e.anim)*3;
      ctx.save();
      if(e.vx > 0){ ctx.scale(-1,1); ctx.translate(-e.w,0); }
      ctx.fillStyle='#1c1712';
      ctx.beginPath(); ctx.ellipse(13,10,12,7,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(3,6,6.5,5.5,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,3); ctx.lineTo(-1,-4); ctx.lineTo(5,1); ctx.fill();
      ctx.fillStyle='#8a5a2b';
      ctx.fillRect(6,14+run,3,5); ctx.fillRect(11,14-run,3,5);
      ctx.fillRect(17,14+run,3,5); ctx.fillRect(21,14-run,3,5);
      ctx.beginPath(); ctx.ellipse(4,10,3.5,3,0,0,7); ctx.fill();
      ctx.fillStyle='#1c1712';
      ctx.beginPath(); ctx.moveTo(24,7); ctx.lineTo(31,2-run); ctx.lineTo(25,11); ctx.fill();
      ctx.fillStyle='#3f6bd8'; ctx.fillRect(7,5,3,8);
      ctx.fillStyle='#e8483c';
      ctx.beginPath(); ctx.moveTo(-2,7); ctx.lineTo(-6,8); ctx.lineTo(-2,9); ctx.fill();
      ctx.fillStyle='#ffd23f';
      ctx.beginPath(); ctx.arc(1,5,1.6,0,7); ctx.fill();
      ctx.restore();
    }
    else if(e.t==='ghost'){
      const a3 = (.55 + Math.sin(e.ph)*.2) * (1 - (e.fade||0)), wob = Math.sin(e.anim)*2;
      ctx.globalAlpha = a3;
      ctx.fillStyle = '#e8e4ff';
      ctx.beginPath();
      ctx.arc(9, 8+wob, 8, Math.PI, 0);
      ctx.lineTo(17, 16+wob);
      for(let k=0;k<3;k++) ctx.quadraticCurveTo(15-k*5, 20+wob, 12-k*5, 16+wob);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2b2118';
      if(e.shy > .5){                          // затуляє очі — і не рухається
        ctx.fillRect(2, 5+wob, 6, 2.6); ctx.fillRect(10, 5+wob, 6, 2.6);
      } else {
        ctx.beginPath(); ctx.arc(6+e.dir, 7+wob, 2.2, 0, 7);
        ctx.arc(12+e.dir, 7+wob, 2.2, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    else if(e.t==='bird'){
      const fl2 = Math.sin(e.anim)*7;
      ctx.fillStyle = '#4a3f7a';
      ctx.beginPath(); ctx.moveTo(10,6); ctx.lineTo(-2,2+fl2); ctx.lineTo(2,10); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(10,6); ctx.lineTo(22,2+fl2); ctx.lineTo(18,10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#6b5cb8';
      ctx.beginPath(); ctx.ellipse(10,6,5.5,4,0,0,7); ctx.fill();
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.moveTo(10+e.dir*5,6); ctx.lineTo(10+e.dir*10,7); ctx.lineTo(10+e.dir*5,8); ctx.fill();
      ctx.fillStyle = '#fff7e6';
      ctx.beginPath(); ctx.arc(10+e.dir*2,4,1.5,0,7); ctx.fill();
    }
    else if(e.t==='icicle'){
      if(e.state===1) ctx.translate(Math.sin(G.frames*.9)*1.6, 0);
      ctx.fillStyle='#dff2ff';
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(12,0); ctx.lineTo(6,e.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.moveTo(3,1); ctx.lineTo(6,1); ctx.lineTo(5,e.h*.6); ctx.closePath(); ctx.fill();
      if(e.state===1){ ctx.fillStyle='rgba(255,120,120,.6)'; ctx.fillRect(0,-5,12,3); }
    }
    else if(e.t==='updraft'){
      const a2 = .12 + Math.sin(e.ph)*.05;
      const gr = ctx.createLinearGradient(0,e.h,0,0);
      gr.addColorStop(0,'rgba(160,255,220,0)'); gr.addColorStop(1,'rgba(160,255,220,'+a2+')');
      ctx.fillStyle = gr; ctx.fillRect(0,0,e.w,e.h);
      ctx.strokeStyle='rgba(160,255,220,.35)'; ctx.lineWidth=1;
      for(let k=0;k<4;k++){
        const yy = e.h - ((G.frames*1.6 + k*40) % e.h);
        ctx.beginPath(); ctx.moveTo(3, yy); ctx.lineTo(e.w-3, yy-4); ctx.stroke();
      }
    }
    else if(e.t==='geyser'){
      ctx.fillStyle='#6b4a2e'; ctx.fillRect(1,2,T-2,6);
      ctx.fillStyle='#3a2618'; ctx.fillRect(4,0,T-8,4);
      if(e.warn){ ctx.fillStyle='rgba(255,176,58,'+(.4+Math.sin(G.frames*.5)*.3)+')';
        ctx.fillRect(4,-5,T-8,5); }
      if(e.hot){
        const gr2 = ctx.createLinearGradient(0,0,0,-5*T);
        gr2.addColorStop(0,'#ffd23f'); gr2.addColorStop(.4,'#ff8a3a');
        gr2.addColorStop(1,'rgba(255,106,43,0)');
        ctx.fillStyle = gr2; ctx.fillRect(3,-5*T,T-6,5*T);
      }
    }
    else if(e.t==='wave'){
      ctx.fillStyle='rgba(255,210,63,'+(.5+Math.sin(e.a)*.3)+')';
      ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(14,14); ctx.lineTo(0,14); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff7e6'; ctx.fillRect(5,6,4,8);
    }
    else if(e.t==='crawler' && art('crawler')){ drawFoe(e, 'crawler', 27); }
    else if(e.t==='spiky' && art('spiky')){ drawFoe(e, 'spiky', 30, true); }
    else if(e.t==='flyer' && art('flyer')){ drawFoe(e, 'flyer', 22); }
    else if(e.t==='jumper' && art('jumper')){ drawFoe(e, 'jumper', 26); }
    else if(e.t==='crawler'){
      if(e.squash>0){ ctx.translate(0,8); ctx.scale(1,.28); }
      const l = Math.sin(e.anim)*2;
      ctx.fillStyle='#2f2a4a';
      ctx.fillRect(2,12+l,3,3); ctx.fillRect(11,12-l,3,3);
      ctx.fillStyle='#4a3f7a';
      ctx.beginPath(); ctx.ellipse(8,7,8,7,0,0,7); ctx.fill();
      ctx.fillStyle='#ffd23f';
      ctx.beginPath(); ctx.arc(5,5,1.8,0,7); ctx.arc(11,8,1.8,0,7); ctx.fill();
      ctx.fillStyle='#fff7e6';
      ctx.beginPath(); ctx.arc(8+e.dir*3,4,2,0,7); ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.arc(8+e.dir*3.6,4,1,0,7); ctx.fill();
    }
    else if(e.t==='spiky'){
      const r = 7, cxp=8, cyp=8;
      ctx.fillStyle='#7a3fa8';
      for(let i=0;i<8;i++){
        const a = i*Math.PI/4 + G.frames*.02*Math.sign(e.vx||1);
        ctx.beginPath();
        ctx.moveTo(cxp+Math.cos(a)*r, cyp+Math.sin(a)*r);
        ctx.lineTo(cxp+Math.cos(a)*(r+5), cyp+Math.sin(a)*(r+5));
        ctx.lineTo(cxp+Math.cos(a+.4)*r, cyp+Math.sin(a+.4)*r);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle='#a45fd0'; ctx.beginPath(); ctx.arc(cxp,cyp,r,0,7); ctx.fill();
      ctx.fillStyle='#ff4d4d'; ctx.beginPath(); ctx.arc(cxp+e.dir*2,cyp-1,2.4,0,7); ctx.fill();
    }
    else if(e.t==='flyer'){
      if(e.squash>0){ ctx.translate(0,6); ctx.scale(1,.3); }
      const f = Math.sin(e.anim*1.6)*5;
      ctx.fillStyle='#3d3470';
      ctx.beginPath(); ctx.moveTo(9,6); ctx.lineTo(-4,1+f); ctx.lineTo(-1,9); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(9,6); ctx.lineTo(22,1+f); ctx.lineTo(19,9); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#5c4fa8'; ctx.beginPath(); ctx.ellipse(9,6,6,5,0,0,7); ctx.fill();
      ctx.fillStyle='#5af0e0'; ctx.beginPath(); ctx.arc(9+e.dir*2,5,1.8,0,7); ctx.fill();
    }
    else if(e.t==='jumper'){
      if(e.squash>0){ ctx.translate(0,10); ctx.scale(1,.28); }
      const sqz = e.onGround&&e.timer<12 ? .7 : 1;
      ctx.save(); ctx.translate(8,16); ctx.scale(1/sqz, sqz); ctx.translate(-8,-16);
      ctx.fillStyle='#2f7a4a';
      ctx.beginPath(); ctx.ellipse(8,9,8,7,0,0,7); ctx.fill();
      ctx.fillStyle='#49b06d'; ctx.beginPath(); ctx.ellipse(8,11,6,4.5,0,0,7); ctx.fill();
      ctx.fillStyle='#fff7e6';
      ctx.beginPath(); ctx.arc(4,4,2.6,0,7); ctx.arc(12,4,2.6,0,7); ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.arc(4+e.dir,4,1.2,0,7); ctx.arc(12+e.dir,4,1.2,0,7); ctx.fill();
      ctx.restore();
    }
    else if(e.t==='boss'){
      const hurtF = e.hurt>0 && Math.floor(G.frames/3)%2===0;
      if(e.squash>0){ ctx.globalAlpha = e.squash/60; }
      const w=e.w,h=e.h;
      ctx.fillStyle = hurtF ? '#ff9a9a' : '#5a5580';
      rr(0,4,w,h-4,6);
      ctx.fillStyle = hurtF ? '#ffd6d6' : '#7d78a8';
      rr(3,7,w-6,h-14,5);
      // ядро
      const pl = .6+Math.sin(G.frames*.16)*.4;
      ctx.fillStyle = 'rgba(255,210,63,'+pl+')';
      ctx.beginPath(); ctx.arc(w/2,h/2+2,9,0,7); ctx.fill();
      ctx.fillStyle='#fff7e6';
      ctx.beginPath(); ctx.arc(w/2,h/2+2,4,0,7); ctx.fill();
      // очі
      ctx.fillStyle='#ff4d4d';
      ctx.beginPath(); ctx.arc(w/2-8+e.dir*2,12,3,0,7); ctx.arc(w/2+8+e.dir*2,12,3,0,7); ctx.fill();
      // роги
      ctx.fillStyle='#3d3a5e';
      ctx.beginPath(); ctx.moveTo(4,6); ctx.lineTo(0,-6); ctx.lineTo(12,4); ctx.fill();
      ctx.beginPath(); ctx.moveTo(w-4,6); ctx.lineTo(w,-6); ctx.lineTo(w-12,4); ctx.fill();
      // здоров'я
      ctx.fillStyle='#1a1140'; ctx.fillRect(0,-12,w,5);
      ctx.fillStyle='#ffd23f'; ctx.fillRect(1,-11,(w-2)*Math.max(0,e.hp)/6,3);
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }
}

/* ── 16. ЧАСТИНКИ ТА ПІДПИСИ ─────────────────────────────── */
function updateFX(){
  for(let i=G.parts.length-1;i>=0;i--){
    const p = G.parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.soft ? -.02 : .28;
    if(p.soft){ p.vx *= .93; } p.life--;
    if(p.life<=0) G.parts.splice(i,1);
  }
  for(let i=G.pops.length-1;i>=0;i--){
    G.pops[i].y -= G.pops[i].say ? .34 : (G.pops[i].big ? .12 : .6);
    if(--G.pops[i].t<=0) G.pops.splice(i,1);
  }
  for(let i=G.bumps.length-1;i>=0;i--) if(--G.bumps[i].t<=0) G.bumps.splice(i,1);
  for(let i=G.rings.length-1;i>=0;i--) if(--G.rings[i].t<=0) G.rings.splice(i,1);
  if(G.shakeT>0) G.shakeT--;
  if(G.flash>0) G.flash--;
}
function drawFX(){
  for(const p of G.parts){
    ctx.globalAlpha = Math.min(1, p.life/16);
    ctx.fillStyle = p.c;
    if(p.soft){ ctx.beginPath(); ctx.arc(p.x, p.y, p.s*(p.life/22)+.6, 0, 7); ctx.fill(); }
    else ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;
  for(const r of G.rings){
    ctx.globalAlpha = r.t/20; ctx.strokeStyle = '#5af0e0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, (14-r.t)*1.7+3, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const p of G.pops){
    ctx.globalAlpha = Math.min(1, p.t/26);
    if(p.say){                                   // репліка — у бульбашці
      ctx.font = 'bold 10px ui-monospace, monospace';
      const w = ctx.measureText(p.s).width + 12;
      const bx = p.x - w/2, by = p.y - 11;
      ctx.fillStyle = 'rgba(255,247,230,.94)';
      rr(bx, by, w, 15, 5);
      ctx.beginPath(); ctx.moveTo(p.x-4, by+15); ctx.lineTo(p.x+4, by+15);
      ctx.lineTo(p.x, by+20); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2b2118'; ctx.fillText(p.s, p.x, by+8);
    } else {
      ctx.font = p.big ? 'bold 11px ui-monospace, monospace' : 'bold 10px ui-monospace, monospace';
      ctx.fillStyle = '#000'; ctx.fillText(p.s, p.x+1, p.y+1);
      ctx.fillStyle = p.big ? '#5af0e0' : '#fff7e6'; ctx.fillText(p.s, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

/* ── 17. КАМЕРА ТА КАДР ──────────────────────────────────── */
function updateCamera(){
  // на швидкості кадр відʼїжджає — видно далі саме тоді, коли це потрібно
  const zt = 1 - Math.min(.09, Math.abs(P.vx)*.021);
  G.zoom += (zt - G.zoom) * .05;
  const marg = (VW/0.91 - VW)/2;   // стала межа: інакше вона «дихає» разом із масштабом
  // Мертва зона: доки Піка в середній смузі кадру, камера стоїть.
  // Розворот не рухає кадр — рухає лише сам гравець, коли виходить за смугу.
  const cx0 = P.x + P.w/2 - G.cam.x;
  const lo = VW*.40, hi = VW*.56;
  if(cx0 < lo) G.cam.x = P.x + P.w/2 - lo;
  else if(cx0 > hi) G.cam.x = P.x + P.w/2 - hi;
  const maxX = G.W*T - VW - marg;
  if(G.meta.boss && !G.bossDead && P.x > G.meta.bossGate*T){
    if(!G.bossActive){
      G.bossActive = true; G.shakeT = 20; SFX.boss(); G.bossIntro = 110; buzz([40,60,40]);
      const b = G.ents.find(e=>e.t==='boss'); if(b) b.timer = 40;
    }
    G.camMin = (G.meta.bossGate-2)*T;
  }
  G.cam.x = Math.max(G.camMin, Math.min(G.cam.x, maxX));
  G.cam.x = Math.max(G.cam.x, marg);
  if(G.meta.boss && !G.bossDead && P.x < G.camMin+4) P.x = G.camMin+4;
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  drawSky();
  const sh = G.shakeT>0 ? (Math.random()-.5)*G.shakeT*.7 : 0;
  ctx.save();
  if(G.zoom !== 1){
    ctx.translate(VW/2, VH/2); ctx.scale(G.zoom, G.zoom); ctx.translate(-VW/2, -VH/2);
  }
  ctx.translate(-Math.round(G.cam.x)+sh, -Math.round(G.cam.y)+sh*.5);
  drawTiles();
  drawEnts();
  if(G.mode==='play') drawGhost();
  if(G.mode==='play'||G.mode==='levelend'||G.mode==='title') drawHero();
  drawFX();
  ctx.restore();
  if(G.theme.fog){ ctx.fillStyle = G.theme.fog; ctx.fillRect(0,0,VW,VH); }
  if(G.inRoom){                                  // підземелля: світить лише герой
    const lx = P.x - G.cam.x + P.w/2, ly = P.y - G.cam.y + P.h/2;
    const gr = ctx.createRadialGradient(lx, ly, 26, lx, ly, 230);
    gr.addColorStop(0, 'rgba(4,3,14,0)');
    gr.addColorStop(.55, 'rgba(4,3,14,.42)');
    gr.addColorStop(1, 'rgba(4,3,14,.86)');
    ctx.fillStyle = gr; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle = 'rgba(255,210,63,' + (.05 + Math.sin(G.frames*.08)*.02) + ')';
    ctx.beginPath(); ctx.arc(lx, ly, 60, 0, 7); ctx.fill();
  }
  if(G.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(G.flash/60)+')'; ctx.fillRect(0,0,VW,VH); }
  drawBall();
  drawPipeHint();
  drawStrike();
  drawBossIntro();
  drawIris();
}

/* Великий покебол у кінці рівня — до нього герой добігає після щогли */
function drawBall(){
  const bx = (G.meta && G.meta.ballX) || 0; if(!bx) return;
  const sx = bx*T - G.cam.x + T/2, sy = 15*T - G.cam.y - 22;
  if(sx < -60 || sx > VW+60) return;
  const open = (P.winPhase === 'ball') ? Math.min(1, P.winT/40) : 0;
  ctx.save();
  ctx.translate(sx, sy);
  const bob = Math.sin(G.frames*.06)*2;
  ctx.translate(0, bob);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(0, 24, 18, 5, 0, 0, 7); ctx.fill();
  ctx.save();
  ctx.translate(0, -open*10);                 // верхня половина відкидається
  ctx.rotate(-open*.5);
  ctx.fillStyle = '#e8483c';
  ctx.beginPath(); ctx.arc(0, 0, 21, Math.PI, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(-7, -8, 5, 0, 7); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff7e6';
  ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2b2118'; ctx.fillRect(-21, -2.5, 42, 5);
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill();
  ctx.fillStyle = open ? '#5af0e0' : '#fff7e6';
  ctx.beginPath(); ctx.arc(0, 0, 4.4, 0, 7); ctx.fill();
  if(open){
    ctx.strokeStyle = 'rgba(90,240,224,'+(1-open)+')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 22 + open*26, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

/* Коли стоїш на трубі — світ сам показує, що можна вниз */
function drawPipeHint(){
  if(!G.canPipe || G.mode !== 'play') return;
  const sx = P.x - G.cam.x + P.w/2, sy = P.y - G.cam.y - 14 + Math.sin(G.frames*.14)*3;
  ctx.save();
  ctx.globalAlpha = .9;
  ctx.fillStyle = '#fff7e6';
  ctx.beginPath(); ctx.moveTo(sx-7, sy-6); ctx.lineTo(sx+7, sy-6); ctx.lineTo(sx, sy+4);
  ctx.closePath(); ctx.fill();
  ctx.font = 'bold 8px ui-monospace, monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,247,230,.85)';
  ctx.fillText('ВНИЗ', sx, sy - 12);
  if(P.pipeT > 0){
    ctx.strokeStyle = '#5af0e0'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sx, sy - 2, 13, -Math.PI/2, -Math.PI/2 + Math.PI*2*(P.pipeT/8));
    ctx.stroke();
  }
  ctx.restore();
}

/* Блискавка Японії: спершу спалах, потім удар */
function drawStrike(){
  if(!G.strikeX) return;
  const sx = G.strikeX - G.cam.x + T/2;
  if(sx < -30 || sx > VW+30) return;
  ctx.save();
  if(G.strikeWarn > 0){
    ctx.fillStyle = 'rgba(255,210,63,'+(.22+Math.sin(G.frames*.6)*.18)+')';
    ctx.fillRect(sx-9, 0, 18, VH);
    ctx.fillStyle = 'rgba(255,210,63,.85)'; ctx.fillRect(sx-11, VH-6, 22, 4);
  } else if(G.strikeHit > 0){
    ctx.globalAlpha = Math.min(1, G.strikeHit/6);
    ctx.strokeStyle = '#fff7e6'; ctx.lineWidth = 4;
    ctx.shadowBlur = 18; ctx.shadowColor = '#ffd23f';
    ctx.beginPath(); ctx.moveTo(sx, 0);
    for(let k=1;k<=7;k++) ctx.lineTo(sx + (Math.random()-.5)*16, VH*k/7);
    ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,'+(G.strikeHit/40)+')'; ctx.fillRect(0,0,VW,VH);
  }
  ctx.restore();
}

/* Вихід боса: одна ілюстрація на весь кадр — і гра завмирає, щоб ти встиг злякатись */
function drawBossIntro(){
  if(!(G.bossIntro > 0)) return;
  const im = art('boss'); if(!im) return;
  const k = G.bossIntro;
  const a = k > 92 ? (110-k)/18 : (k < 26 ? k/26 : 1);
  ctx.globalAlpha = Math.max(0, Math.min(1, a));
  const sc = Math.max(VW/im.width, VH/im.height);
  const w = im.width*sc, h = im.height*sc;
  ctx.drawImage(im, (VW-w)/2, (VH-h)/2, w, h);
  ctx.fillStyle = 'rgba(6,4,20,.28)'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 12px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(90,240,224,.9)';
  ctx.fillText('Б І Й', VW/2, VH*.30);
  ctx.font = 'bold 30px "Arial Black", Impact, sans-serif';
  const bn = (G.meta && G.meta.bossName) || 'ГРОЗОВИЙ ГОЛЕМ';
  ctx.fillStyle = '#000'; ctx.fillText(bn, VW/2+3, VH*.42+3);
  ctx.fillStyle = '#ffd23f'; ctx.fillText(bn, VW/2, VH*.42);
  ctx.globalAlpha = 1;
}

/* ── 18. ГОЛОВНИЙ ЦИКЛ ───────────────────────────────────── */
let last = 0, acc = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last) last = ts;
  let dt = (ts-last)/1000; last = ts;
  if(dt > .25) dt = .25;
  acc += dt;
  let steps = 0;
  while(acc >= 1/60 && steps < 5){ step(); acc -= 1/60; steps++; }
  if(G.grid) render();
}
function step(){
  jumpPressed = IN.up && !upPrev; upPrev = IN.up;
  firePressed = IN.fire && !firePrev; firePrev = IN.fire;
  updateIris();
  if(G.mode==='card'){
    if(--G.cardT <= 0){ hideScreen(); G.mode='play'; G.paused=false; iris('open'); }
    updateFX(); return;
  }
  if(G.mode==='title'){
    G.frames++; updateFX();
    const span = Math.max(1, G.W*T - VW);
    G.cam.x = (G.cam.x + .35) % span;
    return;
  }
  if(G.mode!=='play' || G.paused) { updateFX(); return; }
  if(G.bossIntro > 0){                      // сцена завмирає, поки бос виходить
    G.bossIntro--;
    if(G.bossIntro > 34){ updateFX(); return; }
  }
  if(G.freeze>0){ G.freeze--; return; }
  G.frames++; G.runT++;
  updateMech();
  updateDog();
  if(P.alive && !P.winT) recTick();
  // наскільки ти попереду власного рекорду в цій самій точці рівня
  if(G.ghost && G.frames % 10 === 0){
    const g = G.ghost;
    while(G.ghIdx+3 < g.length && g[G.ghIdx] < P.x) G.ghIdx += 3;
    const d = (G.runT - G.ghIdx) / 60;
    const e = el('hdelta');
    e.textContent = (d<=0?'−':'+') + Math.abs(d).toFixed(1);
    e.className = 'on' + (d>0 ? ' behind' : '');
  }
  updatePlayer();
  updateEnts();
  updateFX();
  updateCamera();
  // таймер
  if(P.alive && !P.winT){
    if(++G.timeTick >= 25){ G.timeTick = 0; G.time--; updateHUD();
      if(G.time <= 0){ G.time = 0; loseLife(false); }
      else if(G.time===100) SFX.bump();
    }
  }
}
requestAnimationFrame(loop);

/* ── 19. HUD ТА ЕКРАНИ ───────────────────────────────────── */
const el = id=>document.getElementById(id);
function updateHUD(){
  el('hscore').textContent = String(G.score).padStart(6,'0');
  el('hberry').textContent = G.berries;
  const hr = el('hrelic');
  if(hr){ hr.textContent = (G.gotRelics|0) + '/3'; hr.className = (G.gotRelics|0) >= 3 ? 'full' : ''; }
  el('hlives').textContent = Math.max(0,G.lives);
  el('htime').textContent  = String(G.time).padStart(3,'0');
  el('htime').classList.toggle('low', G.time<=60);
  el('hlevel').textContent = G.meta && G.meta.cont ? (G.meta.cont + ' · ' + G.meta.name) : (G.meta ? G.meta.name : '');
  const hc = el('hcharge');
  hc.textContent = P.power>1 ? '⚡⚡' : '⚡';
  hc.className = P.power>0 ? 'on' : '';
}

/* ── ПРОГРЕС: що відкрито і де ти зупинився (живе офлайн) ── */
let memProg = null;
function prog(){
  try{ return JSON.parse(localStorage.getItem('pika.prog') || 'null') || {unlocked:0}; }
  catch(e){ return memProg || (memProg = {unlocked:0}); }
}
function saveProg(p){
  try{ localStorage.setItem('pika.prog', JSON.stringify(p)); }
  catch(e){ memProg = p; }
}

/* ── МІНІАТЮРА РІВНЯ: справжня мапа, намальована з тих самих тайлів ── */
const MINI = [];
function miniature(i){
  if(MINI[i] !== undefined) return MINI[i];
  try{
    const m = LEVELS[i](), g = m.grid, th = THEMES[m.theme];
    const W = g[0].length, H = g.length;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const grd = x.createLinearGradient(0,0,0,H);
    grd.addColorStop(0, th.sky[0]); grd.addColorStop(1, th.sky[1]);
    x.fillStyle = grd; x.fillRect(0,0,W,H);
    for(let y=0;y<H;y++) for(let px=0;px<W;px++){
      const ch = g[y][px]; let col = null;
      if(ch==='#')            col = (y>0 && g[y-1][px]==='.') ? th.grassTop : th.dirt;
      else if('XW'.includes(ch))   col = th.stone;
      else if(ch==='B')       col = th.brick;
      else if('?!%'.includes(ch))  col = '#ffd23f';
      else if(ch==='-')       col = '#c98a12';
      else if('[]{}'.includes(ch)) col = th.pipe;
      else if(ch==='L')       col = '#ff6a2b';
      else if(ch==='w')       col = '#2f7fb8';
      else if(ch==='^')       col = '#d9dbe8';
      else if(ch==='G')       col = '#5af0e0';
      else if(ch==='o')       col = 'rgba(90,240,224,.85)';
      else if(ch==='Z')       col = '#8b86c9';
      else if('efxj'.includes(ch)) col = 'rgba(255,77,77,.8)';
      else if(ch==='D')       col = '#ff4d4d';
      else if(ch==='P')       col = '#fff7e6';
      if(col){ x.fillStyle = col; x.fillRect(px,y,1,1); }
    }
    return (MINI[i] = c.toDataURL());
  }catch(e){ return (MINI[i] = ''); }
}

/* ── ЕКРАНИ ── */
const screenEl = el('screen');
const appEl = el('app');
let screenPrimary = null;
screenEl.addEventListener('click', e=>{
  const t = e.target.closest ? e.target.closest('[data-act]') : null;
  if(t){ audioUnlock(); doAct(t.dataset.act, t.dataset.arg); return; }
  // запобіжник: на заставці й на екранах підсумку дотик будь-де робить головну дію
  if(screenEl.classList.contains('title') || screenEl.classList.contains('win') ||
     screenEl.classList.contains('plain')){
    audioUnlock(); screenAction();
  }
});
function showScreen(html, cls){
  if(typeof clearPad === 'function') clearPad();   // руки геть від керування
  screenEl.className = cls || '';
  screenEl.style.backgroundImage =
      cls==='title' ? `url(${ART_SRC.title})` :
      cls==='win'   ? `url(${ART_SRC.win})`   : '';
  screenEl.innerHTML = '<canvas id="arc"></canvas>' + html;
  screenPrimary = screenEl.querySelector('[data-primary]');
  if(cls === 'title') startArc(); else stopArc();
}
function hideScreen(){ screenEl.className = 'hide'; stopArc(); frost(false); }
function frost(on){ if(appEl) appEl.classList.toggle('frost', !!on); }
function screenAction(){
  const d = screenPrimary && screenPrimary.dataset;
  if(d && d.act) doAct(d.act, d.arg);
}
function doAct(a, arg){
  switch(a){
    case 'new':      newGame(0); break;
    case 'continue': {
      const p = prog();
      if(p.save){ G.score=p.save.score|0; G.lives=p.save.lives|0; G.berries=p.save.berries|0;
                  const l=p.save.lvl|0; delete p.save; saveProg(p); frost(false); startLevel(l); }
      else newGame(0);
      break;
    }
    case 'level':    newGame(+arg); break;
    case 'jump':     frost(false); G.paused=false; startLevel(+arg); break;
    case 'resume':   G.paused = false; hideScreen(); break;
    case 'menu':     toMenu(); break;
    case 'save': {
      const p = prog();
      p.save = {lvl:G.levelIdx, score:G.score, lives:G.lives, berries:G.berries};
      saveProg(p);
      toMenu('Збережено. Повернешся — продовжиш із цього рівня.');
      break;
    }
    case 'next':     G.carryPower = P.power; startLevel(G.levelIdx+1); break;
    case 'go': {     const n = isNaN(+arg) ? G.nextLevel : +arg;
                     G.mode = 'card'; G.cardT = 96; showCard(n); break; }
    case 'retry':    if(G.daily) startDaily(); else newGame(G.levelIdx); break;
    case 'shop':     showShop(); break;
    case 'buy':      buyItem(arg); break;
    case 'daily':    startDaily(); break;
  }
}
/* Ягоди — валюта. Купується один раз і діє завжди. */
const SHOP = [
  {k:'life',   name:'ЧЕТВЕРТЕ ЖИТТЯ',   desc:'починаєш із чотирма',      cost:120},
  {k:'magnet', name:'ШИРШИЙ МАГНІТ',    desc:'ягоди тягнуться вдвічі далі', cost:90},
  {k:'shield', name:'ДОВША НЕВРАЗЛИВІСТЬ', desc:'після удару вдвічі більше часу', cost:100},
  {k:'boots',  name:'ЛЕГКІ ЧЕРЕВИКИ',   desc:'стрибок трохи вищий',      cost:160}
];
function shopHas(k){ const p = prog(); return !!(p.shop && p.shop[k]); }
function buyItem(k){
  const p = prog(), it = SHOP.find(q => q.k === k);
  if(!it || (p.coins|0) < it.cost || shopHas(k)) return;
  p.coins = (p.coins|0) - it.cost;
  p.shop = p.shop || {}; p.shop[k] = 1;
  saveProg(p); SFX.power();
  showShop();
}
function showShop(){
  const p = prog(), coins = p.coins|0;
  G.mode = 'shop';
  showScreen(`
    <div class="kicker">Крамниця</div>
    <div class="big">ЯГІДНИЙ СКАРБ</div>
    <div class="stat">У тебе <b>◍ ${coins}</b> ягід</div>
    <div class="lvls">${SHOP.map(it=>{
      const owned = shopHas(it.k), can = coins >= it.cost;
      return `<button class="lv shopit${owned?' own':can?'':' lock'}"` +
             `${owned||!can?' disabled':` data-act="buy" data-arg="${it.k}"`}>
        <span class="lvname">${it.name}</span>
        <span class="lvrec">${it.desc}</span>
        <span class="price">${owned?'✔ куплено':'◍ '+it.cost}</span>
      </button>`;}).join('')}</div>
    <div class="row"><button class="btn" data-act="menu" data-primary>Назад</button></div>`, 'plain');
}

function startDaily(){
  G.score = 0; G.berries = 0; G.paused = false; frost(false);
  G.lives = shopHas('life') ? 4 : 3;
  G.daily = 1; G.carryPower = 1;
  iris('close', ()=>{
    hideScreen(); loadLevel(-1);
    G.mode = 'card'; G.cardT = 96; showCard(-1);
  });
}
function newGame(i){
  G.daily = 0;
  G.score = 0; G.lives = shopHas('life') ? 4 : 3; G.berries = 0;
  G.paused = false; frost(false);
  startLevel(i);
}
function toMenu(note){
  G.paused = false; frost(false); musicStop();
  loadLevel(0); musicStop();
  G.mode = 'title'; showTitle(note);
}

function startLevel(i){
  if(i < 0){ startDaily(); return; }              // виклик дня має власний вхід
  if(i >= LEVELS.length){ showWin(); return; }
  G.nextLevel = i; G.paused = false; frost(false);
  iris('close', ()=>{
    hideScreen(); loadLevel(i);
    if(i % 3 === 0){ G.mode = 'intro'; showIntro(i); }
    else { G.mode = 'card'; G.cardT = 96; showCard(i); }
  });
}
/* Перед першим рівнем континенту — коротка розповідь про те, куди ти прийшов */
function showIntro(i){
  const m = LEVELS[i](), ci = Math.floor(i/3);
  showScreen(`<div class="story">
      <div class="kicker">Континент ${ci+1} з ${CONTINENTS.length}</div>
      <div class="cbig">${m.cont}</div>
      <div class="tale">${CONT_STORY[ci]}</div>
      <div class="mech">${m.hint}</div>
      <button class="btn" data-act="go" data-arg="${i}" data-primary>Далі →</button>
    </div>`, 'plain');
}
function showCard(i){
  const m = (i < 0) ? buildDaily() : LEVELS[i]();
  const rec = records()[i < 0 ? 'daily' : ('lvl'+i)];
  showScreen(`<div class="card">
      <div class="cnum">${m.cont} · ${m.li+1} З 3</div>
      <div class="cname">${m.name}</div>
      <div class="clives"><span class="cbolt">♥</span> × ${G.lives}</div>
      ${rec?`<div class="cbest">твій рекорд · ${fmtTime(rec.t)}</div>`:''}
    </div>`, 'plain');
}
function fmtTime(f){ return (f/60).toFixed(1)+' с'; }

/* П'ять континентів, у кожного три рівні.
   Картка показує мапу, а три цифри під нею — самі рівні. */
const MAP_POS = [[14,62],[33,30],[54,66],[74,28],[90,60]];   // маршрут по глобусу
function levelStrip(act){
  const un = prog().unlocked || 0, r = records();
  return '<div class="lvls">' + CONTINENTS.map((c,ci)=>{
    const base = ci*3;
    const open = base <= un;
    const done = [0,1,2].filter(k => r['lvl'+(base+k)]).length;
    const dots = [0,1,2].map(k=>{
      const i = base+k, o = i <= un, rec = r['lvl'+i], dn = !!rec;
      const m3 = (rec && rec.med) ? rec.med.filter(Boolean).length : 0;
      return `<button class="dot${dn?' done':o?' open':' lock'}"` +
             `${o?` data-act="${act}" data-arg="${i}"`:' disabled'}>${k+1}` +
             `${m3?`<b class="m3">${'•'.repeat(m3)}</b>`:''}</button>`;
    }).join('');
    return `<div class="lv${open?'':' lock'}">
      <span class="lvmap"${open?` style="background-image:url(${miniature(base)})"`:''}></span>
      <span class="lvname">${open ? c.name : '· · ·'}</span>
      <span class="dots">${dots}</span>
      <span class="lvrec">${open ? done+' з 3' : 'закрито'}</span>
    </div>`;
  }).join('') + '</div>';
}

function worldMap(act){
  const un = prog().unlocked || 0, r = records();
  const nodes = CONTINENTS.map((c,ci)=>{
    const base = ci*3, open = base <= un;
    const done = [0,1,2].filter(k => r['lvl'+(base+k)]).length;
    const [mx,my] = MAP_POS[ci];
    const dots = [0,1,2].map(k=>{
      const i = base+k, o = i <= un, rec = r['lvl'+i];
      const m3 = (rec && rec.med) ? rec.med.filter(Boolean).length : 0;
      return `<button class="wdot${rec?' done':o?' open':' lock'}"` +
             `${o?` data-act="${act}" data-arg="${i}"`:' disabled'}>${k+1}` +
             `${m3?`<b class="m3">${'•'.repeat(m3)}</b>`:''}</button>`;
    }).join('');
    return `<div class="wnode${open?'':' lock'}" style="left:${mx}%;top:${my}%">
        <span class="wname">${open ? c.name : '· · ·'}</span>
        <span class="wdots">${dots}</span>
        <span class="wcnt">${open ? done+'/3' : '✕'}</span>
      </div>`;
  }).join('');
  const path = MAP_POS.map(([x,y],i)=> (i?'L':'M')+x+' '+y).join(' ');
  return `<div class="wmap">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="${path}" fill="none" stroke="rgba(255,210,63,.35)"
              stroke-width=".7" stroke-dasharray="2.5 2.5"/>
      </svg>${nodes}</div>`;
}

function showTitle(note){
  G.mode = 'title';
  const p = prog(), r = records();
  showScreen(`
    <div class="title">ПІКА<small>ГРОЗОВИЙ ШЛЯХ</small></div>
    ${note ? `<div class="note">${note}</div>` : ''}
    <div class="row">
      ${p.save
        ? `<button class="btn" data-act="continue" data-primary>Продовжити</button>
           <button class="btn ghost" data-act="new">Нова гра</button>`
        : `<button class="btn" data-act="new" data-primary>Почати гру</button>`}
    </div>
    ${(p.unlocked||0) > 0 ? worldMap('level') : ''}
    <div class="row">
      <button class="btn ghost" data-act="daily">⚡ Виклик дня${p.streak?` · серія ${p.streak}`:''}</button>
      <button class="btn ghost" data-act="shop">◍ Крамниця${p.coins?` · ${p.coins}`:''}</button>
    </div>
    <div class="ghosthint">${r['lvl0']
      ? 'твій найкращий забіг бігтиме поруч — обжени себе'
      : 'гра запамʼятає твій найкращий забіг і пустить його поруч'}</div>`, 'title');
}

function togglePause(){
  if(G.mode !== 'play') return;
  G.paused = !G.paused;
  if(G.paused){
    frost(true);
    showScreen(`
      <div class="kicker">Пауза</div>
      <div class="big">ПЕРЕПОЧИНОК</div>
      ${levelStrip('jump')}
      <div class="row">
        <button class="btn" data-act="resume" data-primary>Продовжити</button>
        <button class="btn ghost" data-act="save">Зберегти і вийти</button>
        <button class="btn ghost" data-act="menu">У меню</button>
      </div>
      <div class="keys"><kbd>←</kbd><kbd>→</kbd> рух · <kbd>Shift</kbd> біг ·
        <kbd>Space</kbd> стрибок · <kbd>K</kbd> розряд</div>
      <div class="ghosthint">напівпрозорий Піка — це твій попередній рекорд</div>`, 'pause');
  } else hideScreen();
}

function endLevel(){
  G.mode = 'levelend';
  const bonus = G.time*50;
  G.score += bonus; updateHUD(); musicStop();
  const pr = prog();
  pr.coins = (pr.coins|0) + G.gotBerries + G.gotRelics*25;    // ягоди йдуть у скарбничку
  if(G.daily){                                                // виклик дня рахується окремо
    const r2 = records(), k = todayKey();
    const old2 = r2.daily;
    const better = !old2 || old2.day !== k || G.runT < old2.t;
    if(!old2 || old2.day !== k) pr.streak = (pr.lastDay === k-1 || pr.lastDay === k) ? (pr.streak|0)+1 : 1;
    pr.lastDay = k;
    if(better) r2.daily = {day:k, t:G.runT, s:G.score, g:G.rec};
    saveRecords(r2); saveProg(pr);
    showScreen(`
      <div class="kicker">Виклик дня</div>
      <div class="big">${G.meta.cont}</div>
      <div class="rec">${better?'НОВИЙ РЕКОРД ДНЯ · ':'ТВІЙ ЧАС · '}${fmtTime(G.runT)}</div>
      <div class="stat">Серія днів поспіль: <b>${pr.streak|0}</b> · очки <b>${G.score}</b></div>
      <div class="row">
        <button class="btn" data-act="daily" data-primary>Ще раз</button>
        <button class="btn ghost" data-act="menu">У меню</button>
      </div>`, 'plain');
    return;
  }
  pr.unlocked = Math.max(pr.unlocked||0, Math.min(G.levelIdx+1, LEVELS.length-1));
  delete pr.save; saveProg(pr);
  const all = records(), key = 'lvl'+G.levelIdx, old = all[key];
  const isRecord = !old || G.runT < old.t;
  const bTarget = Math.ceil(G.meta.berries * 0.8);   // 80% — без підземелля не набереш
  const med = [1,
    G.gotBerries >= bTarget ? 1 : 0,
    G.runT <= G.meta.par ? 1 : 0];
  const oldMed = (old && old.med) || [0,0,0];
  const newMed = med.map((v,i)=> v || oldMed[i]);
  const oldRel = (old && old.rel) || 0;
  const rel = Math.max(oldRel, G.gotRelics);
  all[key] = isRecord ? {t:G.runT, s:G.score, g:G.rec, med:newMed, rel}
                      : {...old, med:newMed, rel};
  saveRecords(all);
  const line = isRecord
    ? `<div class="rec">НОВИЙ РЕКОРД · ${fmtTime(G.runT)}${old?` — було ${fmtTime(old.t)}`:''}</div>`
    : `<div class="stat">Час <b>${fmtTime(G.runT)}</b> · твій рекорд ${fmtTime(old.t)}</div>`;
  const medRow = `<div class="meds">
      <span class="med on">✔<i>пройдено</i></span>
      <span class="med${med[1]?' on':''}">◍<i>${G.gotBerries}/${bTarget} ягід</i></span>
      <span class="med${med[2]?' on':''}">⏱<i>норматив ${fmtTime(G.meta.par)}</i></span>
      <span class="med${G.gotRelics?' on':''}">✦<i>${rel}/3 реліквії</i></span>
    </div>`;
  if(G.levelIdx+1 >= LEVELS.length){ showWin(bonus, line); return; }
  showScreen(`
    <div class="kicker">Рівень пройдено</div>
    <div class="big">${G.meta.name}</div>
    ${line}
    ${medRow}
    <div class="stat">Бонус за час <b>+${bonus}</b> · разом <b>${G.score}</b> · життя <b>${G.lives}</b></div>
    <div class="row">
      <button class="btn" data-act="next" data-primary>Далі →</button>
      <button class="btn ghost" data-act="menu">У меню</button>
    </div>`, 'plain');
}
function showGameOver(){
  G.mode='gameover'; musicStop(); frost(false);
  showScreen(`
    <div class="kicker">Заряд вичерпано</div>
    <div class="big">ГРУ ЗАВЕРШЕНО</div>
    <div class="stat">Очки: <b>${G.score}</b> · ${G.daily?'Виклик дня':'Рівень: <b>'+(G.levelIdx+1)+'</b>'}</div>
    <div class="row">
      <button class="btn" data-act="retry" data-primary>Спробувати знову</button>
      <button class="btn ghost" data-act="menu">У меню</button>
    </div>`, 'plain');
}
function showWin(bonus, line){
  G.mode='win'; musicStop(); frost(false);
  const pr = prog(); pr.unlocked = LEVELS.length-1; delete pr.save; saveProg(pr);
  const rAll = records();
  let med = 0, rel = 0, tt = 0;
  for(let i=0;i<LEVELS.length;i++){
    const q = rAll['lvl'+i]; if(!q) continue;
    med += (q.med||[]).filter(Boolean).length; rel += q.rel||0; tt += q.t||0;
  }
  [523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.24,'square',.06),i*160));
  showScreen(`
    <div class="kicker">Грозу приборкано</div>
    <div class="title" style="font-size:clamp(26px,6vw,58px)">ПЕРЕМОГА<small>Піка повернув небу спокій</small></div>
    ${line||''}
    <div class="card2">
      <div class="c2row"><span>Континентів</span><b>${CONTINENTS.length} / ${CONTINENTS.length}</b></div>
      <div class="c2row"><span>Медалей</span><b>${med} / ${LEVELS.length*3}</b></div>
      <div class="c2row"><span>Реліквій</span><b>${rel} / ${LEVELS.length*3}</b></div>
      <div class="c2row"><span>Сумарний час</span><b>${fmtTime(tt)}</b></div>
      <div class="c2row"><span>Очки</span><b>${G.score}</b>${bonus?` <i>+${bonus}</i>`:''}</div>
      ${rel>=LEVELS.length*3 ? '<div class="rec">УСІ РЕЛІКВІЇ ЗІБРАНО</div>' : ''}
    </div>
    <div class="row">
      <button class="btn" data-act="new" data-primary>Пройти ще раз</button>
      <button class="btn ghost" data-act="menu">У меню</button>
    </div>
    <div class="ghosthint">твій найкращий забіг тепер бігтиме поруч</div>`, 'win');
}

/* ── 20. ЕЛЕКТРИЧНА ДУГА НА ЗАСТАВЦІ ─────────────────────── */
let arcRAF = null;
function startArc(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = el('arc'); if(!c) return;
  const a = c.getContext('2d');
  function fit(){ c.width = screenEl.clientWidth; c.height = screenEl.clientHeight; }
  fit(); addEventListener('resize', fit);
  let t = 0;
  (function tick(){
    arcRAF = requestAnimationFrame(tick);
    a.clearRect(0,0,c.width,c.height);
    t++;
    if(t%46 > 5) return;
    const y = c.height*.22, x1 = c.width*.2, x2 = c.width*.8;
    a.strokeStyle = 'rgba(90,240,224,.5)'; a.lineWidth = 1.5;
    a.shadowBlur = 12; a.shadowColor = '#5af0e0';
    a.beginPath(); a.moveTo(x1, y);
    const seg = 12;
    for(let i=1;i<=seg;i++){
      a.lineTo(x1 + (x2-x1)*i/seg, y + (Math.random()-.5)*c.height*.12);
    }
    a.stroke(); a.shadowBlur = 0;
  })();
}
function stopArc(){ if(arcRAF){ cancelAnimationFrame(arcRAF); arcRAF=null; } }

/* ── СТАРТ ───────────────────────────────────────────────── */
loadLevel(0); G.mode='title'; musicStop();   // рівень як живе тло заставки
showTitle();
</script>
