<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0b2b">
<title>Піка — Грозовий шлях</title>
<style>
  :root{
    --night:#0e0b2b;
    --deep:#1b1450;
    --volt:#ffd23f;
    --cheek:#ff4d4d;
    --ozone:#5af0e0;
    --bone:#fff7e6;
    --dim:#8b86c9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--night);overflow:hidden;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
    touch-action:none;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--bone)}

  #app{position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;
    max-height:100dvh;background:#000;overflow:hidden;
    box-shadow:0 0 0 2px #2a2170, 0 24px 60px rgba(0,0,0,.6)}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}

  /* ── HUD ─────────────────────────────────────────── */
  #hud{position:absolute;inset:0;pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 9px) 14px 0;
    display:flex;justify-content:space-between;align-items:flex-start;
    font-size:clamp(9px,1.5vmin,13px);font-variant-numeric:tabular-nums;
    letter-spacing:.1em;text-shadow:0 2px 0 rgba(0,0,0,.85)}
  .hgrp{display:flex;align-items:center;gap:14px;color:var(--bone)}
  #hlevel{color:var(--dim);letter-spacing:.3em;font-size:.82em}
  #hberry::before{content:'◍ ';color:var(--ozone)}
  #hrelic::before{content:'✦ ';color:var(--volt)}
  #hrelic{color:var(--dim)}
  #hrelic.full{color:var(--volt);text-shadow:0 0 10px rgba(255,210,63,.6)}
  #hlives::before{content:'♥ ';color:var(--cheek)}
  #htime{color:var(--dim)}
  #htime.low{color:var(--cheek);animation:pulse .5s infinite}
  @keyframes pulse{50%{opacity:.3}}
  #hdelta{color:var(--ozone);opacity:0;transition:opacity .3s;font-size:.92em}
  #hdelta.on{opacity:.9}
  #hdelta.behind{color:var(--cheek)}
  #hcharge{font-style:normal;color:var(--volt);opacity:.18;transition:opacity .2s}
  #hcharge.on{opacity:1;text-shadow:0 0 12px var(--volt)}

  /* ── Екрани ──────────────────────────────────────── */
  #screen{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:clamp(8px,1.8vmin,16px);
    text-align:center;padding:clamp(10px,2vmin,20px);overflow-y:auto;
    background:radial-gradient(120% 90% at 50% 40%,rgba(20,14,62,.97),rgba(5,3,17,.99))}
  #screen .lead,#screen .keys,#screen .stat,#screen .note,#screen .ghosthint,
  #screen .kicker,#screen .lvname,#screen .lvrec{text-shadow:none}
  #screen.hide{display:none}
  /* Пауза не ховає гру — вона її приморожує */
  #screen.pause{background:rgba(10,6,30,.4);animation:fadeIn .22s ease}
  #screen.title,#screen.win{background-size:cover;background-position:center;
    background-repeat:no-repeat}
  #screen.title::before,#screen.win::before{content:'';position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(6,4,20,.34) 0%,rgba(6,4,20,.62) 46%,rgba(6,4,20,.9) 100%)}
  #screen.title>*:not(canvas),#screen.win>*:not(canvas){position:relative;z-index:1}
  #screen>canvas#arc{position:absolute!important;left:0;top:0;
    width:100%;height:100%;z-index:0;pointer-events:none}
  @keyframes fadeIn{from{opacity:0}}
  #app.frost #cv{filter:blur(7px) saturate(.5) brightness(.5)}

  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
  .note{color:var(--ozone);font-size:clamp(9px,1.6vmin,12px);letter-spacing:.14em}

  /* Смужка рівнів: у кожної картки — справжня мапа рівня */
  .wmap{position:relative;width:min(94%,720px);height:clamp(96px,26vmin,190px);
    background:linear-gradient(180deg,rgba(90,240,224,.05),rgba(255,210,63,.04));
    border:1px solid rgba(255,255,255,.1);border-radius:12px}
  .wmap svg{position:absolute;inset:0;width:100%;height:100%}
  .wnode{position:absolute;transform:translate(-50%,-50%);display:flex;
    flex-direction:column;align-items:center;gap:3px}
  .wnode.lock{opacity:.35}
  .wname{font-size:clamp(7px,1.3vmin,10px);letter-spacing:.14em;color:var(--bone)}
  .wcnt{font-size:clamp(6px,1.1vmin,9px);color:var(--dim)}
  .wdots{display:flex;gap:3px}
  .wdot{position:relative;pointer-events:auto;cursor:pointer;font-family:inherit;
    width:clamp(16px,3.2vmin,24px);height:clamp(16px,3.2vmin,24px);border-radius:50%;
    font-size:clamp(7px,1.4vmin,10px);font-weight:700;padding:0;
    border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:var(--dim);
    transition:transform .12s}
  .wdot.open{border-color:var(--volt);color:var(--volt)}
  .wdot.done{background:var(--volt);border-color:var(--volt);color:#221602}
  .wdot.lock{opacity:.3;cursor:default}
  .wdot:hover:not(.lock){transform:scale(1.2)}
  .shopit{width:clamp(120px,30vmin,210px)}
  .shopit.own{border-color:var(--volt);opacity:.85}
  .shopit.lock{opacity:.4}
  .price{display:block;padding:0 6px 7px;font-size:clamp(8px,1.4vmin,11px);color:var(--volt)}
  .lvls{display:flex;gap:clamp(6px,1.4vmin,12px);flex-wrap:wrap;
    justify-content:center;max-width:min(94%,760px)}
  .lv{position:relative;padding:0;overflow:hidden;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);border-radius:9px;
    width:clamp(88px,17vmin,150px);font-family:inherit;color:var(--bone);
    transition:transform .16s cubic-bezier(.16,1,.3,1),border-color .16s,background .16s}
  .lv:hover:not(.lock){border-color:rgba(255,210,63,.5)}
  .lvmap{display:block;height:clamp(26px,6.4vmin,48px);background-size:100% 100%;
    background-position:center;image-rendering:pixelated;opacity:.9}
  .lvname{display:block;padding:5px 6px 2px;font-size:clamp(8px,1.5vmin,11px);letter-spacing:.14em}
  .lvrec{display:block;padding:0 6px 6px;font-size:clamp(7px,1.3vmin,9px);
    color:var(--dim);letter-spacing:.1em}
  .meds{display:flex;gap:clamp(6px,1.6vmin,14px);justify-content:center;flex-wrap:wrap}
  .med{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.28;
    color:var(--dim);font-size:clamp(13px,2.6vmin,20px);transition:opacity .3s}
  .med.on{opacity:1;color:var(--volt);text-shadow:0 0 12px rgba(255,210,63,.5)}
  .med i{font-style:normal;font-size:clamp(7px,1.3vmin,10px);letter-spacing:.1em;color:var(--dim)}
  .dots{display:flex;gap:4px;justify-content:center;padding:2px 0 4px}
  .dot{pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:700;
    width:clamp(18px,3.6vmin,26px);height:clamp(18px,3.6vmin,26px);border-radius:50%;
    font-size:clamp(8px,1.5vmin,11px);border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.05);color:var(--dim);padding:0;
    transition:transform .12s,background .12s,color .12s}
  .dot.open{border-color:var(--volt);color:var(--volt)}
  .dot.done{background:var(--volt);border-color:var(--volt);color:#221602}
  .dot.lock{opacity:.3;cursor:default}
  .m3{position:absolute;left:0;right:0;bottom:-7px;font-size:7px;letter-spacing:1px;
    color:var(--volt);font-weight:400}
  .dot{position:relative}
  .dot:hover:not(.lock),.dot:focus-visible:not(.lock){transform:scale(1.18)}
  .lv.lock{opacity:.3;cursor:default}
  .lv.lock .lvmap{background:repeating-linear-gradient(45deg,
    #241b45,#241b45 5px,#1b1450 5px,#1b1450 10px)}

  @media (max-height:430px){
    #screen{gap:6px}
    #screen .keys{display:none}
    #screen .ghosthint{display:none}
    .title{font-size:clamp(26px,11vmin,54px)}
    .big{font-size:clamp(20px,7vmin,34px)}
    .lvmap{height:clamp(20px,5vmin,34px)}
    .btn{padding:9px 16px}
  }
  .kicker{color:var(--ozone);font-size:clamp(8px,1.5vw,12px);letter-spacing:.42em;text-transform:uppercase}
  .title{font-family:"Arial Black","Helvetica Neue",Impact,sans-serif;font-weight:900;
    font-size:clamp(30px,13vmin,88px);line-height:.86;letter-spacing:-.03em;
    color:var(--volt);transform:skewX(-6deg);
    text-shadow:3px 3px 0 #b3450a, 6px 6px 0 #2a1a5e, 0 0 34px rgba(255,210,63,.35)}
  .title small{display:block;font-size:.3em;letter-spacing:.22em;color:var(--bone);
    text-shadow:2px 2px 0 #000;transform:skewX(6deg);margin-top:10px;font-weight:900}
  #arc{position:absolute;pointer-events:none;left:0;top:0;width:100%;height:100%}
  .lead{max-width:44ch;color:#cfc9ff;font-size:clamp(10px,1.9vw,14px);line-height:1.7}
  .lead b{color:var(--volt)}
  .btn{pointer-events:auto;cursor:pointer;border:2px solid var(--volt);background:transparent;
    color:var(--volt);font-family:inherit;font-weight:700;letter-spacing:.16em;
    padding:11px 22px;font-size:clamp(10px,1.9vmin,14px);text-transform:uppercase;
    transition:background .12s,color .12s,transform .12s}
  .btn:hover,.btn:focus-visible{background:var(--volt);color:#221602;transform:translateY(-2px)}
  .btn.ghost{border-color:rgba(255,255,255,.22);color:var(--dim);font-weight:400;
    padding:11px 18px;letter-spacing:.12em}
  .btn.ghost:hover,.btn.ghost:focus-visible{background:rgba(255,255,255,.1);
    color:var(--bone);border-color:rgba(255,255,255,.45)}
  .btn:focus-visible{outline:3px solid var(--ozone);outline-offset:3px}
  .keys{color:var(--dim);font-size:clamp(8px,1.5vw,12px);line-height:2}
  .keys kbd{color:var(--bone);border:1px solid #4b429b;border-radius:3px;padding:1px 6px;margin:0 2px}
  .big{font-family:"Arial Black",sans-serif;font-size:clamp(26px,6vw,56px);color:var(--bone);
    text-shadow:3px 3px 0 #000;letter-spacing:-.02em}
  .stat{color:var(--dim);font-size:clamp(10px,2vw,14px);line-height:2}
  .stat b{color:var(--volt)}
  .rec{color:var(--volt);font-weight:700;letter-spacing:.2em;
    font-size:clamp(10px,2vw,14px);text-shadow:0 0 16px rgba(255,210,63,.5)}
  .card{display:flex;flex-direction:column;align-items:center;gap:10px;
    animation:cardIn .35s cubic-bezier(.16,1,.3,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}}
  .cnum{color:var(--ozone);letter-spacing:.5em;font-size:clamp(9px,1.7vw,13px)}
  .story{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.6vmin,14px);
    max-width:min(90%,620px);animation:cardIn .4s cubic-bezier(.16,1,.3,1)}
  .tale{color:#dcd6ff;font-size:clamp(10px,2vmin,15px);line-height:1.75}
  .mech{color:var(--ozone);font-size:clamp(8px,1.5vmin,11px);letter-spacing:.2em;
    border-top:1px solid rgba(90,240,224,.25);padding-top:8px}
  .cbig{font-family:"Arial Black",sans-serif;color:var(--volt);letter-spacing:.24em;
    font-size:clamp(16px,3.4vmin,26px);text-shadow:0 0 24px rgba(255,210,63,.45);
    animation:contIn .5s cubic-bezier(.16,1,.3,1)}
  @keyframes contIn{from{opacity:0;letter-spacing:.6em}}
  .cname{font-family:"Arial Black",sans-serif;font-size:clamp(24px,5.5vw,48px);
    color:var(--bone);letter-spacing:-.01em;text-shadow:3px 3px 0 #000}
  .clives{color:var(--dim);letter-spacing:.24em;font-size:clamp(11px,2.2vw,16px)}
  .cbolt{color:var(--volt);text-shadow:0 0 12px var(--volt)}
  .cbest{color:var(--dim);font-size:clamp(9px,1.7vw,12px);letter-spacing:.14em;opacity:.8}
  .ghosthint{margin-top:6px;color:rgba(90,240,224,.65);font-size:clamp(8px,1.5vw,11px);
    letter-spacing:.18em}

  /* ── Тач-керування ───────────────────────────────── */
  #pad{position:absolute;inset:0;pointer-events:none;display:none;
    padding:0 14px calc(env(safe-area-inset-bottom) + 14px)}
  #pad.on{display:block}
  /* Видно маленьке кільце, а натискається вся чверть екрана під ним */
  :root{--pb:clamp(46px,8vmin,66px)}
  #pad{touch-action:none}
  .pbtn{position:absolute;pointer-events:none;display:flex;
    align-items:center;justify-content:center;border-radius:50%;
    border:2px solid rgba(255,255,255,.45);
    background:rgba(10,7,30,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    color:rgba(255,247,230,.92);font-size:calc(var(--pb)*.46);font-weight:900;
    width:var(--pb);height:var(--pb);opacity:.72;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    transition:opacity .25s,transform .07s,background .07s,border-color .07s}
  #pad.dim .pbtn{opacity:.4}
  .pbtn.act{opacity:1;background:rgba(255,210,63,.9);color:#1a1206;
    border-color:#fff7e6;box-shadow:0 0 22px rgba(255,210,63,.75)}
  .pbtn.act::after{content:'';position:absolute;inset:-9px;border-radius:50%;
    border:2px solid rgba(255,210,63,.55)}
  #bB{border-color:rgba(90,240,224,.55);color:#5af0e0}
  /* Зʼявляється тільки тоді, коли під ногами справді є труба */
  #bD{border-color:rgba(255,247,230,.6);color:#fff7e6;
      opacity:0;pointer-events:none;transform:translateX(-50%) scale(.6)}
  #pad.pipe #bD{opacity:.95;transform:translateX(-50%) scale(1);
      animation:pipePulse 1.1s ease-in-out infinite}
  @keyframes pipePulse{50%{box-shadow:0 0 20px rgba(255,247,230,.5)}}
  #bA{border-color:rgba(255,210,63,.6);color:var(--volt)}
  #rotate{display:none;position:absolute;left:0;right:0;bottom:0;z-index:5;
    padding:7px;text-align:center;font-size:11px;letter-spacing:.14em;
    color:#221602;background:var(--volt)}
  @media (orientation:portrait) and (pointer:coarse){ #rotate{display:block} }
  #bP{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);pointer-events:auto;
    z-index:3;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.22);
    color:rgba(255,247,230,.5);font-family:inherit;opacity:.45;
    font-size:9px;letter-spacing:.14em;padding:6px 14px;border-radius:20px;transition:opacity .3s}
  #pad.dim #bP{opacity:.14}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="640" height="360"></canvas>

  <div id="hud">
    <div class="hgrp"><span id="hscore">000000</span><i id="hcharge">⚡</i></div>
    <div class="hgrp" id="hlevel">ЛУГ ІСКОР</div>
    <div class="hgrp"><span id="hdelta"></span><span id="hrelic">0/3</span><span id="hberry">0</span><span id="htime">300</span><span id="hlives">3</span></div>
  </div>

  <div id="pad">
    <button class="pbtn" id="bL" aria-label="Ліворуч">◀</button>
    <button class="pbtn" id="bR" aria-label="Праворуч">▶</button>
    <button class="pbtn" id="bD" aria-label="Вниз у трубу">▼</button>
    <button class="pbtn" id="bB" aria-label="Розряд">⚡</button>
    <button class="pbtn" id="bA" aria-label="Стрибок">▲</button>
    <button id="bP">ПАУЗА</button>
  </div>

  <div id="rotate">Поверни телефон горизонтально</div>
  <div id="screen"><canvas id="arc"></canvas></div>
</div>

const ART = {};
for(const k in ART_SRC){ const i = new Image(); i.src = ART_SRC[k]; ART[k] = i; }
function art(k){ const i = ART[k]; return (i && i.complete && i.naturalWidth) ? i : null; }

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const VW = 640, VH = 360, T = 20;      // видима область і розмір тайла
ctx.imageSmoothingEnabled = false;

/* ── 1. КЕРУВАННЯ ─────────────────────────────────────────── */
const IN = {left:0,right:0,up:0,down:0,run:0,fire:0};
let upPrev=0, firePrev=0, jumpPressed=0, firePressed=0;

const KEYMAP = {
  ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', Space:'up',
  ArrowDown:'down', KeyS:'down',
  ShiftLeft:'run', ShiftRight:'run', KeyJ:'run',
  KeyK:'fire', KeyX:'fire', KeyZ:'fire'
};
addEventListener('keydown', e=>{
  if(KEYMAP[e.code]){ IN[KEYMAP[e.code]]=1; e.preventDefault(); }
  if(e.code==='KeyP'||e.code==='Escape') togglePause();
  if(e.code==='KeyM') toggleMute();
  if(e.code==='KeyR' && G.mode==='play') loseLife(true);
  if(e.code==='Enter' || (e.code==='Space' && G.mode!=='play')) screenAction();
  audioUnlock();
});
addEventListener('keyup', e=>{ if(KEYMAP[e.code]){ IN[KEYMAP[e.code]]=0; e.preventDefault(); } });
addEventListener('blur', ()=>{ for(const k in IN) IN[k]=0; });

// тач
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if(isTouch) document.getElementById('pad').classList.add('on');
/* Керування зонами: нижня половина екрана поділена без щілин.
   Промазати неможливо — палець завжди потрапляє в якусь зону,
   а якщо він зʼїжджає вбік, керування переходить далі без розриву. */
const padEl = document.getElementById('pad');
const appEl0 = document.getElementById('app');
const ZONES = [                       // частки ширини кадру, зліва направо
  {a:'left',  x0:0.000, x1:0.155, el:'bL'},
  {a:'right', x0:0.155, x1:0.310, el:'bR'},
  {a:'down',  x0:0.555, x1:0.690, el:'bD', cond:()=>!!G.canPipe},
  {a:'fire',  x0:0.690, x1:0.845, el:'bB'},
  {a:'up',    x0:0.845, x1:1.000, el:'bA'}
];
const Y_START = 0.54;                 // нижче цієї межі — керування
/* Кнопка стоїть рівно посередині своєї зони. Одне джерело правди —
   промазати повз те, що бачиш, більше неможливо. */
function placeButtons(){
  for(const z of ZONES){
    const b = document.getElementById(z.el);
    if(!b) continue;
    b.style.left = ((z.x0 + z.x1) / 2 * 100) + '%';
    b.style.right = 'auto';
    b.style.transform = 'translateX(-50%)';
    b.style.bottom = '4%';
  }
}
placeButtons();
addEventListener('resize', placeButtons);
addEventListener('orientationchange', placeButtons);
const active = new Map();                        // pointerId → зона
function zoneAt(e){
  const r = appEl0.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  if(fy < Y_START) return null;
  return ZONES.find(z => fx >= z.x0 && fx < z.x1 && (!z.cond || z.cond())) || null;
}
/* Палець може зійти з кнопки, вийти за екран або бути перехопленим
   системним жестом. Тоді "відпускання" не приходить — і кнопка залипає.
   Тому: захоплюємо вказівник, слухаємо ще й вікно, і скидаємо все
   на будь-якій зміні стану гри. */
function recount(){
  const on = new Set();
  for(const z of active.values()) if(z) on.add(z.a);
  for(const z of ZONES){
    const el2 = document.getElementById(z.el);
    if(el2) el2.classList.toggle('act', on.has(z.a));
  }
  IN.left = on.has('left') ? 1 : 0;
  IN.right = on.has('right') ? 1 : 0;
  IN.up   = on.has('up')   ? 1 : 0;
  IN.fire = on.has('fire') ? 1 : 0;
  IN.down = on.has('down') ? 1 : 0;
  IN.run  = (IN.left || IN.right) ? 1 : 0;       // на телефоні біг завжди ввімкнено
}
function clearPad(){                              // усе відпустити
  active.clear();
  recount();
  IN.left = IN.right = IN.up = IN.down = IN.fire = IN.run = 0;
}
function padDown(e){
  if(e.target && e.target.closest && e.target.closest('#bP')) return;
  if(e.preventDefault) e.preventDefault();
  audioUnlock(); padWake();
  try{ padEl.setPointerCapture(e.pointerId); }catch(_){}
  active.set(e.pointerId, zoneAt(e));
  recount();
}
function padMove(e){
  if(!active.has(e.pointerId)) return;            // палець лишається "своїм",
  if(e.preventDefault) e.preventDefault();        // навіть коли зійшов із зони
  active.set(e.pointerId, zoneAt(e));
  recount();
}
function padUp(e){
  const id = e && e.pointerId;
  if(id === undefined || !active.has(id)) return;
  if(e.preventDefault) e.preventDefault();
  active.delete(id);
  recount();
  try{ padEl.releasePointerCapture(id); }catch(_){}
}
if(isTouch && padEl){
  padEl.addEventListener('pointerdown', padDown);
  padEl.addEventListener('pointermove', padMove);
  padEl.addEventListener('pointerup', padUp);
  padEl.addEventListener('pointercancel', padUp);
  padEl.addEventListener('lostpointercapture', padUp);
  addEventListener('pointerup', padUp);           // якщо відпустив поза грою
  addEventListener('pointercancel', padUp);
  padEl.style.pointerEvents = 'auto';
}

function audioUnlock(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
}
function tone(freq, dur, type='square', vol=.05, slide=0){
  if(!actx||muted) return;
  const t0=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+.02);
}
function noise(dur, vol=.06){
  if(!actx||muted) return;
  const n=Math.floor(actx.sampleRate*dur), buf=actx.createBuffer(1,n,actx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=actx.createBufferSource(), g=actx.createGain();
  s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(actx.destination); s.start();
}

function fill(g,x1,y1,x2,y2,ch){ for(let y=y1;y<=y2;y++) for(let x=x1;x<=x2;x++) if(g[y]&&x>=0&&x<g[0].length) g[y][x]=ch; }
function put(g,x,y,ch){ if(g[y]&&x>=0&&x<g[0].length) g[y][x]=ch; }
function line(g,x,y,s){ for(let i=0;i<s.length;i++) if(s[i]!==' ') put(g,x+i,y,s[i]); }
function gnd(g,x1,x2,top=15,ch='#'){ fill(g,x1,top,x2,17,ch); }
function pipe(g,x,h,base=14){
  put(g,x,base-h+1,'['); put(g,x+1,base-h+1,']');
  for(let y=base-h+2;y<=base;y++){ put(g,x,y,'{'); put(g,x+1,y,'}'); }
}
function stairUp(g,x,h,base=14,ch='X'){ for(let i=0;i<h;i++) fill(g,x+i,base-i,x+i,base,ch); }
function stairDn(g,x,h,base=14,ch='X'){ for(let i=0;i<h;i++) fill(g,x+i,base-(h-1-i),x+i,base,ch); }
function goalPole(g,x,base=14,top=7){ for(let y=top;y<=base;y++) put(g,x,y,'G'); }

const POOL_EASY = ['flat','arc','blocks','crawler','crawler2','pit2','plat','pipe','stairs',

/* Арена боса: ворота, стіна, платформа із зарядом і сам бос */
function bossArena(g, x0){
  put(g,x0-6,14,'Z');                    // перед боєм — точка збереження
  fill(g,x0,0,x0,10,'X');
  fill(g,x0+34,0,x0+35,17,'X');
  put(g,x0+7,13,'D');
  line(g,x0+9,10,'-!-');
  line(g,x0+18,10,'---');
  put(g,x0+13,14,'o'); put(g,x0+15,14,'o');
  return [x0+24, 7, 14];                       // де зʼявиться маяк
}

/* Один рівень на добу, однаковий для всіх, хто відкриє гру сьогодні */
function todayKey(){
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}
let DAILY_CACHE = null, DAILY_KEY = 0;
function buildDaily(){
  const k = todayKey();
  if(DAILY_CACHE && DAILY_KEY === k) return DAILY_CACHE;
  DAILY_KEY = k;
  const base = buildLevel(4 + (k % 8));            // беремо середню складність
  const R = rng(k);
  const ci = k % CONTINENTS.length;
  const m = {...base, ci, theme:ci, cont:CONTINENTS[ci].name,
             name:'ВИКЛИК ДНЯ', li:0, boss:false, daily:true,
             tune:CONTINENTS[ci].tune, mech:CONTINENTS[ci].mech,
             hazard:CONTINENTS[ci].hazard, ice:!!CONTINENTS[ci].ice,
             hint:CONTINENTS[ci].hint,
             time: base.time + 60};
  // трохи перетасовуємо ворогів, щоб день був упізнаваним, але своїм
  const g = base.grid.map(r => r.slice());
  for(let y=0;y<18;y++) for(let x=0;x<g[0].length;x++){
    if(g[y][x]==='e' && R() < .3) g[y][x] = R()<.5 ? 'E' : 'V';
    if(g[y][x]==='f' && R() < .3) g[y][x] = 'H';
  }
  m.grid = g;
  return (DAILY_CACHE = m);
}

const LEVEL_CACHE = [];
function buildLevel(i){
  if(LEVEL_CACHE[i]) return LEVEL_CACHE[i];
  const ci = Math.floor(i/3), li = i%3, c = CONTINENTS[ci];
  const isBoss = li === 2;
  const R = rng(ci*9173 + li*577 + 41);
  const diff = i;                                    // 0..14

  // добираємо послідовність блоків
  const seq = ['flat','crawler'];
  if(diff < 3) seq.push('blocks');
  seq.push('power', 'brickStep');
  const count = 10 + Math.min(7, Math.floor(diff*0.5)) + (isBoss ? 0 : 1);
  const pool = diff < 3 ? POOL_EASY : diff < 8 ? POOL_MID : POOL_HARD;
  const soft = diff < 3 ? POOL_EASY : POOL_MID;
  let prev = '';
  for(let k=0; k<count; k++){
    let s;
    const foes = diff < 3 ? ENEMY_EASY : ENEMY_HARD;
    const free = diff < 3 ? FREE.filter(q => !['tunnel','movV'].includes(q)) : FREE;
    // такт із семи: бій · цегла · вільний · яма · механіка · вільний · цегла
    if(k === 3) s = 'pipeDown';                    // одне підземелля, зате помітне
    else if(k % 7 === 1 || k % 7 === 6) s = pick(R, BRICKS);
    else if(k % 7 === 2 || k % 7 === 5) s = pick(R, free);
    else if(k % 7 === 3) s = pick(R, PITS);
    else if(k % 7 === 4) s = c.seg ? c.seg : pick(R, BRICKS);
    else if(k % 7 === 0 && k > 0 && R() < .5) s = pick(R, PITS);   // ям стало більше
    else s = (diff >= 5 && R() < .28)
             ? pick(R, ['hazard','spikes','hazard2','tunnel'])
             : pick(R, foes);
    if(s === prev) s = pick(R, s === pick(R,BRICKS) ? free : soft);   // не два однакові поспіль
    if(prev.startsWith('blocks') && s === 'tunnel') s = 'flat';
    seq.push(s);
    prev = s;
    if(k === Math.floor(count/3) || k === Math.floor(count*2/3)) seq.push('check');
    if(k === Math.floor(count/2) && R() < .5) seq.push('life');
  }
  seq.push('bigstairs','flat');

  // рахуємо ширину
  const GAP = 2, ROOM_W = 46;
  let W = 6;
  for(const s of seq) W += SEG[s].w + GAP;
  const arenaAt = W + 4;
  W += isBoss ? 40 : 18;
  const mainW = W;                       // де закінчується сам маршрут
  const roomBase = W + 4;
  const nRooms = seq.filter(s2 => s2 === 'pipeDown').length;
  W = roomBase + nRooms * ROOM_W + 2;

  const g = mk(W);
  gnd(g, 0, roomBase - 3);
  put(g,3,14,'P');
  const pipes = [];
  let x = 6;
  for(const s of seq){
    const r = SEG[s].f(g, x, R, c);
    if(r && r.pipe !== undefined) pipes.push({px:r.pipe, backX:r.pipe + 3});
    x += SEG[s].w + GAP;
  }
  // будуємо по кімнаті на кожну трубу
  pipes.forEach((pp, k) => {
    const rx = roomBase + k*ROOM_W;
    pp.roomX = rx;
    const RW = ROOM_W - 3;
    fill(g, rx, 5, rx+RW, 5, 'X');                  // склепіння
    fill(g, rx, 15, rx+RW, 17, '#');                // підлога
    fill(g, rx, 6, rx, 14, 'X');                    // ліва стіна
    fill(g, rx+RW, 6, rx+RW, 14, 'X');              // права стіна
    // справжнє підземелля: яруси, цегла, вороги і небезпека
    line(g, rx+4,  13, 'oooooo');
    line(g, rx+4,  11, 'B?BB');
    put(g, rx+8, 14, 'e');
    fill(g, rx+11, 15, rx+13, 17, c.hazard === 'L' ? 'L' : (c.hazard === 'w' ? 'w' : '.'));
    line(g, rx+11, 12, '---');  line(g, rx+11, 10, 'ooo');
    put(g, rx+16, 14, 'x');
    fill(g, rx+18, 9, rx+21, 9, 'X');
    line(g, rx+18, 8, 'oooo');
    put(g, rx+20, 14, 'E');
    line(g, rx+23, 12, 'B!BB%B');
    put(g, rx+26, 14, 'e');  put(g, rx+29, 10, 'H');
    line(g, rx+27, 13, 'ooooo');
    fill(g, rx+33, 12, rx+33, 14, 'B');
    put(g, rx+36, 14, 'j');
    line(g, rx+34, 8, 'ooo');
    pipe(g, rx+RW-3, 2);
    put(g, rx+RW-3, 13, 'U');                       // труба назад
  });

  let goalAt = null, bossGate = 0;
  if(isBoss){
    goalAt = bossArena(g, arenaAt);
    bossGate = arenaAt - 2;
    for(let y=goalAt[1]; y<=goalAt[2]; y++) put(g, goalAt[0], y, '.');
  } else {
    goalPole(g, mainW - 12);
  }
  const ballX = isBoss ? (arenaAt + 30) : (mainW - 5);   // великий покебол у фіналі

  /* Три реліквії: у скарбниці, на найвищій точці і замурована в цеглі */
  const relics = [];
  if(pipes[0] && pipes[0].roomX !== undefined){
    put(g, pipes[0].roomX + 30, 8, 'R'); relics.push(1);
  }
  for(let x = 14; x < mainW - 14 && relics.length < 2; x++){
    let done = false;
    for(let y = 9; y < 14; y++)
      if(g[y][x]==='B' && g[y+1][x]==='B' && (g[y][x-1]==='B' || g[y][x+1]==='B')){
        put(g, x, y, 'R'); relics.push(1); done = true; break;   // друга — замурована
      }
    if(done) break;
  }

  // третя — замурована; якщо цегли не знайшлось, ховаємо високо над маршрутом
  while(relics.length < 3){
    let px = -1, py = -1, best = 99;
    for(let x = 40; x < mainW - 24; x++)
      for(let y = 4; y < 11; y++)
        if('#XB'.includes(g[y][x]) && g[y-1][x]==='.' && g[y-2][x]==='.' && y < best){
          best = y; px = x; py = y-1;
        }
    if(px > 0) put(g, px, py, 'R'); else put(g, 60 + relics.length*40, 6, 'R');
    relics.push(1);
  }
  /* Заселення маршруту: щільність росте зі складністю */
  const GROUND = ['e','e','e','E','j'], AIR = ['f','V','V','H'];
  const stepE = Math.max(7, 14 - Math.floor(diff*0.5));
  const freeUp = (xx, from) => {            // скільки вільно над цією колонкою
    let n = 0;
    for(let y = from; y >= 0; y--){ if(g[y][xx] !== '.') break; n++; }
    return n;
  };
  const nearSafe = xx => {                  // біля точки збереження нікого не селимо
    for(let q = xx-6; q <= xx+6; q++)
      for(let y = 12; y <= 14; y++)
        if(g[y] && (g[y][q] === 'Z' || g[y][q] === 'd' || g[y][q] === 'U')) return true;
    return false;
  };
  for(let x = 26; x < mainW - 18; x += stepE){
    const xx = x + Math.floor(R()*4);
    if(g[15][xx] !== '#') continue;
    const head = freeUp(xx, 14);
    if(head < 3) continue;                  // тісний прохід лишаємо порожнім
    if(nearSafe(xx)) continue;              // і біля чекпоінта чи труби теж
    if(R() < .42){
      const ay = R() < .5 ? 9 : 7;
      if(g[ay][xx] === '.' && g[ay-1][xx] === '.') put(g, xx, ay, pick(R, AIR));
      else put(g, xx, 14, pick(R, GROUND));
    } else if(head >= 5 && R() < .22){
      put(g, xx, 14, 'x');                  // колючку — лише там, де є де перестрибнути
    } else put(g, xx, 14, pick(R, GROUND));
  }
  let berries = 0;
  for(let y=0;y<18;y++) for(let x=0;x<W;x++) if(g[y][x]==='o') berries++;
  const par = Math.round(mainW * 13 / 60) * 60;            // норматив: тісний, але досяжний

  const meta = {
    grid:g, name:LEVEL_TITLES[ci][li], cont:c.name, ci, li,
    theme:ci, time: 420 + li*40 + ci*15, tune:c.tune,
    ice: !!c.ice, hazard: c.hazard, mech: c.mech, hint: c.hint, pipes, roomBase, ballX,
    relics: relics.length, berries, par,
    boss:isBoss, bossName:c.boss, bossHP:[5,6,6,7,8][ci],
    bossGate, goalAt          // у тайлах: множення на T роблять місця використання
  };
  return (LEVEL_CACHE[i] = meta);
}

/* Кільцевий перехід: кадр стискається в точку і розкривається на новій сцені */
function iris(mode, after){ G.iris = {t:0, dur:22, mode, after:after||null}; }
function updateIris(){
  if(!G.iris) return;
  G.iris.t++;
  if(G.iris.t >= G.iris.dur){
    const a = G.iris.after; G.iris = null;
    if(a) a();
  }
}
function drawIris(){
  if(!G.iris) return;
  const k = G.iris.t/G.iris.dur;
  const p = G.iris.mode==='close' ? 1-k : k;
  const rMax = Math.hypot(VW, VH)/2 + 10;
  const r = rMax * (p*p*(3-2*p));
  const cx = P.x - G.cam.x + P.w/2, cy = P.y - G.cam.y + P.h/2;
  ctx.fillStyle = '#06041a';
  ctx.beginPath(); ctx.rect(0,0,VW,VH);
  ctx.arc(Math.max(60,Math.min(VW-60,cx)), Math.max(60,Math.min(VH-60,cy)), r, 0, 7, true);
  ctx.fill('evenodd');
}

  inv:0, anim:0, state:'idle', alive:true, ride:null,
  bolts:0, deadT:0, winT:0,
  sx:1, sy:1, combo:0, trail:[], wasGround:true
};
const POWER_NAME = ['ПІЧУ','ПІКАЧУ','РАЙЧУ'];
const HERO_BOX  = [14, 24, 30];        // силует і тіло тримають одну пропорцію,
                                       // щоб велика форма не «ковтала» блоки поруч
/* Зміна форми: ноги лишаються на місці, голова росте вгору.
   Якщо над головою стеля — притискаємось під неї, а не застрягаємо в ній. */
function setPower(n){
  n = Math.max(0, Math.min(2, n));
  const nh = HERO_BOX[n];
  if(nh !== P.h){
    const feet = P.y + P.h;
    let ny = feet - nh;
    if(nh > P.h && (isSolid(tileAt(P.x+2, ny)) || isSolid(tileAt(P.x+P.w-2, ny))))
      ny = Math.floor(ny/T)*T + T;
    P.y = ny; P.h = nh;
  }
  P.power = n;
}
/* Стоп-кадр — найдешевший спосіб зробити удар відчутним */
function freeze(n){ G.freeze = Math.max(G.freeze||0, n); }
function dust(x, y, n, c){
  for(let i=0;i<n;i++) G.parts.push({x, y, vx:(Math.random()-.5)*3.4,
    vy:-Math.random()*1.8, life:16+Math.random()*10, c:c||'rgba(255,255,255,.75)', s:2, soft:1});
}
function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

/* ── 6б. РЕКОРДИ Й ПРИВИД ЗАБІГУ ───────────────────────────
   Гра запам'ятовує твій найкращий прохід кожного рівня і наступного
   разу пускає його поруч напівпрозорим силуетом. Змагаєшся сам із собою. */
let memFallback = {};
function records(){
  try{ return JSON.parse(localStorage.getItem('pika.rec') || '{}'); }
  catch(e){ return memFallback; }
}
function saveRecords(r){
  try{ localStorage.setItem('pika.rec', JSON.stringify(r)); }
  catch(e){ memFallback = r; }
}
const ST = ['idle','run','jump','fall','crouch'];
function recTick(){
  if(G.runT % 3 !== 0 || !G.rec || G.rec.length > 12000) return;
  G.rec.push(Math.round(P.x), Math.round(P.y), (Math.max(0,ST.indexOf(P.state))<<1) | (P.dir>0?1:0));
}
function ghostAt(t){
  const g = G.ghost; if(!g || g.length < 6) return null;
  const k = Math.floor(t/3), f = t/3 - k, i = k*3;
  if(i+2 >= g.length) return null;
  let j = (i+5 < g.length) ? i+3 : i;
  // якщо між кадрами стрибок (труба) — не розмазуємо привида по екрану
  if(Math.abs(g[j]-g[i]) > 40 || Math.abs(g[j+1]-g[i+1]) > 40) j = i;
  return {x: g[i] + (g[j]-g[i])*f, y: g[i+1] + (g[j+1]-g[i+1])*f,
          st: ST[g[i+2]>>1] || 'idle', d: (g[i+2]&1) ? 1 : -1};
}
/* Привид — не блідий Піка, а чистий силует: його ні з чим не сплутаєш */
function drawGhost(){
  const s = ghostAt(G.runT); if(!s) return;
  if(s.x < G.cam.x-60 || s.x > G.cam.x+VW+60) return;
  const t = G.frames*.28, air = (s.st==='jump'||s.st==='fall');
  const leg = s.st==='run' ? Math.sin(t*2)*3.4 : 0;
  const bob = s.st==='run' ? Math.abs(Math.sin(t*2))*1.4 : Math.sin(G.frames*.05)*.8;
  ctx.save();
  ctx.translate(Math.round(s.x)+P.w/2, Math.round(s.y)+P.h);
  if(s.d < 0) ctx.scale(-1,1);
  ctx.scale(HK, HK);
  ctx.beginPath();
  // хвіст
  ctx.moveTo(-4,-14); ctx.lineTo(-14,-18); ctx.lineTo(-9,-20);
  ctx.lineTo(-16,-28); ctx.lineTo(-5,-21); ctx.closePath();
  // ноги
  ctx.moveTo(0,-4); ctx.ellipse(-3, -4-(air?3:Math.max(0,leg)), 3, 4.2, 0, 0, 7);
  ctx.moveTo(9,-4); ctx.ellipse( 4, -4-(air?3:Math.max(0,-leg)), 3, 4.2, 0, 0, 7);
  // тіло і голова
  ctx.moveTo(8,-13-bob); ctx.ellipse(0, -13-bob, 8, 8.5, 0, 0, 7);
  ctx.moveTo(9,-23-bob); ctx.ellipse(0, -23-bob, 9, 8.2, 0, 0, 7);
  // вуха
  ctx.moveTo(-4,-33-bob); ctx.ellipse(-4.5, -33-bob, 2.8, 8, -.34, 0, 7);
  ctx.moveTo( 6,-33-bob); ctx.ellipse( 5,   -33-bob, 2.8, 8,  .34, 0, 7);
  ctx.fillStyle = 'rgba(90,240,224,.16)';
  ctx.fill();
  ctx.shadowBlur = 7; ctx.shadowColor = 'rgba(90,240,224,.7)';
  ctx.strokeStyle = 'rgba(90,240,224,.42)'; ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();
}

/* ── 7. ЗАВАНТАЖЕННЯ РІВНЯ ───────────────────────────────── */
function loadLevel(i){
  const meta = (i < 0) ? buildDaily() : LEVELS[i]();
  G.meta = meta; G.grid = meta.grid.map(r => r.slice());   // кеш рівня лишається чистим
  G.W = meta.grid[0].length; G.H = meta.grid.length;
  G.theme = THEMES[meta.theme]; G.levelIdx = i;
  G.time = meta.time; G.timeTick = 0; G.frames = 0;
  G.ents = []; G.parts = []; G.bumps = []; G.pops = []; G.rings = [];
  G.chain = 0; G.lastBerry = -99; G.inRoom = 0;
  G.gotBerries = 0; G.gotRelics = 0; G.pipeHinted = 0;
  if(typeof clearPad === 'function') clearPad();   // новий рівень — чисті кнопки
  G.magnetR = shopHas('magnet') ? 108 : 58;
  G.invT    = shopHas('shield') ? 210 : 110;
  PH.jump   = shopHas('boots') ? -8.9 : -8.4;
  PH.jumpRun= shopHas('boots') ? -9.4 : -8.9;
  G.canPipe = false; if(typeof padEl!=='undefined' && padEl) padEl.classList.remove('pipe');
  G.dogAt  = Math.floor((meta.roomBase - 3) * 0.32) * T;  // перша зустріч
  G.dogAt2 = Math.floor((meta.roomBase - 3) * 0.68) * T;  // друга
  G.dogDone = 0; G.dogWarn = 0;
  G.wind = 0; G.windDir = 1; G.strikeT = 0; G.strikeX = 0; G.strikeWarn = 0; G.strikeHit = 0;
  G.hints = (HINTS[i] || []).map(h => ({x:h[0]*T, y:h[1]*T, s:h[2], done:0}));
  if(meta.li === 0 && meta.hint) G.hints.push({x:24*T, y:11*T, s:meta.hint, done:0});
  G.bossActive = false; G.bossDead = false; G.camMin = 0; G.bossIntro = 0;
  G.goalOpen = !meta.boss;
  if(meta.boss && meta.goalAt){
    const [gx,gy1,gy2]=meta.goalAt;
    for(let y=gy1;y<=gy2;y++) put(G.grid,gx,y,'.');   // ціль з'явиться після боса
  }
  // зчитуємо спавни
  for(let y=0;y<G.H;y++) for(let x=0;x<G.W;x++){
    const c = G.grid[y][x];
    if(c==='P'){ G.spawn={x:x*T, y:y*T-4}; G.grid[y][x]='.'; }
    else if('efxjDEHV'.includes(c)){ spawnEnemy(c, x*T, y*T); G.grid[y][x]='.'; }
    else if('iuy'.includes(c)){ spawnEnemy(c, x*T, y*T); G.grid[y][x]='.'; }
    else if(c==='R'){ G.ents.push({t:'relic', x:x*T+3, y:y*T+3, w:14, h:14, a:Math.random()*6}); G.grid[y][x]='.'; }
    else if(c==='o'){ G.ents.push({t:'berry', x:x*T+4, y:y*T+4, w:12, h:12, a:Math.random()*6}); G.grid[y][x]='.'; }
    else if(c==='p'||c==='q'){
      G.ents.push({t:'plat', x:x*T, y:y*T, w:3*T, h:9, ox:x*T, oy:y*T,
                   vert:c==='q', ph:Math.random()*6, dx:0, dy:0});
      G.grid[y][x]='.';
    }
  }
  const rec = records()[i < 0 ? 'daily' : ('lvl'+i)];
  G.ghost = rec && rec.g ? rec.g : null; G.zoom = 1; G.ghIdx = 0; G.look = 0;
  G.rec = []; G.runT = 0;
  resetPlayer(true);
  setPower(G.carryPower || 0);   // здобуту силу забираєш із собою на наступний рівень
  G.carryPower = 0;
  updateHUD();
  musicStart(meta.tune);
}
function spawnEnemy(c,x,y){
  const k = 1 + (G.meta && G.meta.ci ? G.meta.ci : 0) * 0.14;   // далі — швидше
  const base = {x:x, y:y, vx:0, vy:0, alive:true, squash:0, anim:Math.random()*6, dir:-1};
  if(c==='i') return G.ents.push({t:'icicle', x:x+4, y:y, w:12, h:16, state:0, timer:0, alive:true});
  if(c==='u') return G.ents.push({t:'updraft', x:x, y:(y-8*T), w:T, h:9*T, ph:0});
  if(c==='y') return G.ents.push({t:'geyser', x:x, y:y, w:T, h:T,
                                  timer: (Math.floor(x/T) % 2) ? 110 : 0, hot:0});
  if(c==='e') G.ents.push({...base, t:'crawler', w:16, h:14, y:y+6, vx:-.72*k});
  if(c==='E') G.ents.push({...base, t:'crawler', w:16, h:14, y:y+6, vx:-1.5*k, swift:1});
  if(c==='x') G.ents.push({...base, t:'spiky', w:16, h:16, y:y+4, vx:-.34*k});
  if(c==='f') G.ents.push({...base, t:'flyer', w:18, h:12, y0:y, vx:-.94*k, woke:0});
  if(c==='j') G.ents.push({...base, t:'jumper', w:16, h:16, y:y+4, vx:0, timer:34});
  if(c==='H') G.ents.push({...base, t:'ghost', w:18, h:18, vx:0, ph:Math.random()*6});
  if(c==='V') G.ents.push({...base, t:'bird', w:20, h:12, y0:y, vx:-1.9*k, woke:0});
  if(c==='D') G.ents.push({...base, t:'boss', w:38, h:44, y:y-24, hp:6, vx:0, hurt:0,
                            state:'idle', timer:60, dead:false});
}
function resetPlayer(full){
  P.x = G.spawn.x; P.y = G.spawn.y; P.vx = 0; P.vy = 0; P.dir = 1;
  P.onGround = false; P.inv = 90; P.alive = true; P.deadT = 0; P.winT = 0;
  P.ride = null; P.bolts = 0; P.state = 'idle';
  P.sx = P.sy = 1; P.combo = 0; P.trail.length = 0; P.wasGround = true;
  G.inRoom = 0; P.pipeT = 0;        // після смерті ти завжди нагорі, на маршруті
  G.freeze = 0;
  if(full){ P.power = 0; P.h = HERO_BOX[0]; }
  G.cam.x = Math.max(G.camMin, Math.min(P.x - VW/2, G.W*T - VW));
}

/* ── 8. ТАЙЛОВА ФІЗИКА ───────────────────────────────────── */
function tileAt(x,y){
  const tx = Math.floor(x/T), ty = Math.floor(y/T);
  if(ty<0||ty>=G.H) return '.';
  if(tx<0||tx>=G.W) return 'W';           // невидимі стіни по краях
  return G.grid[ty][tx];
}
function isSolid(c){ return SOLID.includes(c) || c==='!' || c==='%'; }
function isDeadly(c){ return c==='^' || c==='L'; }

function moveBody(b, tiles=true){
  // X
  b.x += b.vx;
  if(tiles){
    const yTop=b.y+2, yBot=b.y+b.h-2;
    if(b.vx>0){
      if(isSolid(tileAt(b.x+b.w,yTop))||isSolid(tileAt(b.x+b.w,yBot))){
        // зачіп за карниз: якщо перешкода ледь вища за ступні — підтягуємось, а не гальмуємо
        if(b===P && ledgeSnap(b, 1)) { /* підтягнулись */ }
        else { b.x = Math.floor((b.x+b.w)/T)*T - b.w - .01; b.vx = 0; b.hitWall = 1; }
      }
    } else if(b.vx<0){
      if(isSolid(tileAt(b.x,yTop))||isSolid(tileAt(b.x,yBot))){
        if(b===P && ledgeSnap(b, -1)) { /* підтягнулись */ }
        else { b.x = Math.floor(b.x/T)*T + T + .01; b.vx = 0; b.hitWall = -1; }
      }
    }
  }
  // Y
  b.y += b.vy; b.onGround = false;
  const xL=b.x+2, xR=b.x+b.w-2;
  if(b.vy>0){
    const yb = b.y+b.h;
    const cL=tileAt(xL,yb), cR=tileAt(xR,yb);
    if(isSolid(cL)||isSolid(cR)){
      b.y = Math.floor(yb/T)*T - b.h; b.vy = 0; b.onGround = true;
      if(cL==='S'||cR==='S'){ b.vy = PH.springV; b.onGround=false; if(b===P) SFX.spring(); }
    } else if(cL==='-'||cR==='-'){
      const top = Math.floor(yb/T)*T;
      if(b.y+b.h-b.vy <= top+1){ b.y = top - b.h; b.vy = 0; b.onGround = true; }
    }
  } else if(b.vy<0){
    const cL=isSolid(tileAt(xL,b.y)), cR=isSolid(tileAt(xR,b.y));
    if(cL||cR){
      // кутова корекція: зачепився кутом голови — обходимо, а не втрачаємо стрибок
      if(b===P && (cL!==cR)){
        const edge = cL ? Math.floor(xL/T)*T+T - xL : xR - Math.floor(xR/T)*T;
        if(edge <= PH.corner){
          b.x += cL ? (edge+1) : -(edge+1);
          if(!isSolid(tileAt(b.x+2,b.y)) && !isSolid(tileAt(b.x+b.w-2,b.y))) return;
          b.x -= cL ? (edge+1) : -(edge+1);
        }
      }
      b.y = Math.floor(b.y/T)*T + T; b.vy = 0;
      if(b===P) hitBlockAbove();
    }
  }
}

/* Підтягування на низький карниз: робить стрибки «щедрими», не змінюючи геометрію */
function ledgeSnap(b, dir){
  if(b.vy < -1) return false;
  const probe = dir>0 ? b.x + b.w : b.x;
  const feet = b.y + b.h;
  for(let up = 2; up <= PH.ledge; up += 2){
    const ny = b.y - up;
    if(isSolid(tileAt(probe, ny+2)) || isSolid(tileAt(probe, ny+b.h-2))) continue;
    if(isSolid(tileAt(b.x+2, ny)) || isSolid(tileAt(b.x+b.w-2, ny))) continue;
    b.y = ny; b.vy = Math.min(b.vy, 0);
    return true;
  }
  return false;
}

function hitBlockAbove(){
  const tx = Math.floor((P.x+P.w/2)/T), ty = Math.floor((P.y-2)/T);
  if(ty<0||ty>=G.H||tx<0||tx>=G.W) return;
  const c = G.grid[ty][tx];
  if(c==='?'||c==='!'||c==='%'){
    G.grid[ty][tx]='M';
    G.bumps.push({x:tx,y:ty,t:12});
    if(c==='?'){ collectBerry(tx*T+10, ty*T); }
    else {
      G.ents.push({t:'item', kind:(c==='!'?'charge':'life'), x:tx*T+2, y:ty*T-2,
                   w:16,h:16, vx:1.2, vy:-2.4, rise:16});
      SFX.bump();
    }
  } else if(c==='B'){
    if(P.power > 0){
      G.grid[ty][tx]='.';
      G.bumps.push({x:tx,y:ty,t:8});
      for(let i=0;i<8;i++) G.parts.push({x:tx*T+10,y:ty*T+10,
        vx:(Math.random()-.5)*5, vy:-Math.random()*5-1, life:34, c:G.theme.brick, s:4});
      addScore(50); SFX.brick();
    } else { G.bumps.push({x:tx,y:ty,t:10}); SFX.bump(); }
  } else if(isSolid(c)) SFX.bump();
}

/* ── 9. ГРАВЕЦЬ ───────────────────────────────────────────── */
function updatePlayer(){
  if(!P.alive){                                    // анімація смерті
    P.deadT++; P.y += P.vy; P.vy = Math.min(P.vy+.5, 12);
    if(P.deadT>110) respawn();
    return;
  }
  if(P.winT){
    P.winT++;
    if(P.winPhase==='slide'){
      P.x = P.poleX; P.vx = 0; P.dir = -1; P.y += 3.6;
      if(G.frames%3===0) G.parts.push({x:P.x+2, y:P.y+14, vx:(Math.random()-.5)*2,
        vy:-Math.random()*2, life:20, c:'#5af0e0', s:2, soft:1});
      if(isSolid(tileAt(P.x+P.w/2, P.y+P.h+2))){ P.winPhase='walk'; P.winT=1; SFX.power(); }
      P.state='fall'; return;
    }
    if(P.winPhase === 'ball'){                    // покебол відкривається
      P.vx *= .8; P.vy += PH.grav; moveBody(P); P.state='idle';
      if(P.winT===2){ SFX.power(); G.flash=18; firework(); }
      if(P.winT===36) firework();
      if(G.frames%3===0) G.parts.push({x:(G.meta.ballX+.5)*T, y:13.4*T,
        vx:(Math.random()-.5)*5, vy:-Math.random()*4, life:34, c:'#ff4d4d', s:3});
      if(P.winT>78) endLevel();
      return;
    }
    P.dir = 1; P.vx = Math.min(P.vx+.16, 2.2); P.vy += PH.grav; moveBody(P); P.state='run';
    P.anim += .3;
    if(P.winT===30) firework();
    const bx2 = (G.meta.ballX || 0)*T;
    if(P.x >= bx2 - 22 || P.winT > 260){ P.winPhase='ball'; P.winT=1; }
    return;
  }

  const dir = (IN.right?1:0) - (IN.left?1:0);
  const run = IN.run;
  const acc = run ? PH.accRun : PH.acc;
  const max = run ? PH.maxRun : PH.maxWalk;

  if(dir){
    P.vx += acc*dir*(P.onGround?1:.75);
    if(Math.abs(P.vx)>max) P.vx = max*Math.sign(P.vx);
    P.dir = dir;
  } else {
    P.vx *= P.onGround ? PH.fric : PH.air;
    if(Math.abs(P.vx)<.06) P.vx = 0;
  }
  // гальмування-розворот (як у Маріо)
  if(dir && Math.sign(P.vx)!==dir && P.vx!==0) P.vx += acc*dir*.8;

  // стрибок з coyote-time і буфером
  if(P.onGround) P.coyote = PH.coyote; else if(P.coyote>0) P.coyote--;
  if(jumpPressed) P.buffer = PH.buffer; else if(P.buffer>0) P.buffer--;
  // стрибок від стіни: притиснувся боком, падаєш — можна відштовхнутись
  const wallSide = (!P.onGround && P.vy > -1)
    ? (isSolid(tileAt(P.x + P.w + 2, P.y + P.h*0.5)) ? 1
      : isSolid(tileAt(P.x - 2, P.y + P.h*0.5)) ? -1 : 0) : 0;
  if(wallSide && P.vy > 1) P.vy = Math.min(P.vy, 2.6);        // ковзання по стіні
  if(wallSide && P.buffer > 0 && P.coyote <= 0){
    P.vy = PH.jump * .95; P.vx = -wallSide * 4.2; P.dir = -wallSide;
    P.buffer = 0; SFX.jump(); buzz(10);
    dust(P.x + (wallSide>0 ? P.w : 0), P.y + P.h*0.5, 5, 'rgba(255,255,255,.7)');
  }
  else if(P.buffer>0 && P.coyote>0){
    P.vy = Math.abs(P.vx)>3 ? PH.jumpRun : PH.jump;
    P.buffer = 0; P.coyote = 0; P.onGround = false; P.ride = null; SFX.jump();
    P.sx = .78; P.sy = 1.26; dust(P.x+7, P.y+P.h, 4); buzz(8);
  }
  // висота стрибка залежить від утримання кнопки
  P.vy += (P.vy<0 && IN.up) ? PH.gravHold : PH.grav;
  if(P.vy > PH.maxFall) P.vy = PH.maxFall;

  const prevBottom = P.y + P.h, fallV = P.vy;
  moveBody(P);
  // приземлення
  if(P.onGround && !P.wasGround){
    if(fallV > 4){ P.sx = 1 + Math.min(.36, fallV*.03); P.sy = 1 - Math.min(.3, fallV*.026);
      dust(P.x+7, P.y+P.h, fallV>8?7:4); }
    if(fallV > 9.6){ G.shakeT = 5; buzz(12); }
    P.combo = 0;
  }
  P.wasGround = P.onGround;
  P.sx += (1-P.sx)*.18; P.sy += (1-P.sy)*.18;
  // слід швидкості
  if(Math.abs(P.vx) > 3.5 && G.frames%2===0){
    P.trail.push({x:P.x, y:P.y, d:P.dir, t:9});
    if(P.trail.length>5) P.trail.shift();
  }
  for(let i=P.trail.length-1;i>=0;i--) if(--P.trail[i].t<=0) P.trail.splice(i,1);

  // рухомі платформи
  P.ride = null;
  for(const e of G.ents){
    if(e.t!=='plat') continue;
    if(P.x+P.w>e.x && P.x<e.x+e.w && prevBottom<=e.y+4 && P.y+P.h>=e.y && P.y+P.h<=e.y+14 && P.vy>=0){
      P.y = e.y - P.h; P.vy = 0; P.onGround = true; P.ride = e;
    }
  }
  if(P.ride){ P.x += P.ride.dx; P.y += P.ride.dy; }

  // постріл
  if(firePressed && P.power>0 && P.bolts < (P.power>1?4:2)){
    for(const d of (P.power>1 ? [1,-1] : [P.dir])){
      // висота пострілу рахується від тіла, а не константою — інакше
      // велика форма стріляє над головами дрібних ворогів
      G.ents.push({t:'bolt', x:P.x+(d>0?P.w:-8), y:P.y + P.h*0.6 - 3, w:10, h:7,
                   vx:d*(P.power>1?7.4:6.5), life:70, a:0, big:P.power>1});
      P.bolts++;
    }
    SFX.bolt();
  }

  // смертельні тайли й прірва
  const cx = P.x+P.w/2;
  if(isDeadly(tileAt(cx, P.y+P.h-2)) || isDeadly(tileAt(cx, P.y+4))) damage(true);
  if(P.y > G.H*T + 40) loseLife(false);

  // перша зустріч із трубою на рівні — гра пояснює сама
  if(!G.pipeHinted && G.meta.pipes && G.meta.pipes[0]){
    const px0 = G.meta.pipes[0].px * T;
    if(Math.abs(P.x - px0) < 150){
      G.pipeHinted = 1;
      popText(px0 + 10, 8*T, 'У ТРУБІ — ПІДЗЕМЕЛЛЯ · ТРИМАЙ ВНИЗ', 170);
    }
  }
  // труба: тримай «вниз» на отворі
  const under = P.onGround && !P.winT ? tileAt(cx, P.y + P.h + 2) : '.';
  const canPipe = (under === 'd' || under === 'U');
  if(canPipe !== !!G.canPipe){
    G.canPipe = canPipe;
    if(padEl) padEl.classList.toggle('pipe', canPipe);
    if(canPipe) padWake();
  }
  if(P.onGround && IN.down && !P.winT){
    const tt = under;
    if(tt === 'd' || tt === 'U'){
      P.pipeT = (P.pipeT || 0) + 1;
      if(P.pipeT === 1) SFX.bump();
      if(P.pipeT > 8){ P.pipeT = 0; usePipe(tt, Math.floor(cx/T)); }
    } else P.pipeT = 0;
  } else P.pipeT = 0;
  // підказки
  if(G.hints) for(const h of G.hints){
    if(!h.done && P.x > h.x - 90 && P.x < h.x + 200){ h.done = 1; popText(h.x, h.y, h.s, 150); }
  }
  // чекпоінт
  if(tileAt(cx, P.y+P.h/2)==='Z' && P.x > G.spawn.x + 20){
    G.spawn = {x: Math.floor(cx/T)*T, y: P.y};
    G.flash = 8; SFX.berry();
  }
  // ціль
  if(G.goalOpen && tileAt(cx, P.y+P.h/2)==='G' && !P.winT){
    P.winT = 1; P.winPhase = 'slide';
    if(typeof clearPad === 'function') clearPad(); // на фініші керування відпускається
    P.poleX = Math.floor(cx/T)*T + 4;
    const h = Math.max(0, 14 - Math.floor(P.y/T));
    addScore(h*200); popText(P.x, P.y-8, '+'+(h*200));
    SFX.goal(); musicStop(); G.flash = 20; buzz([20,40,20]);
  }

  // анімація
  if(P.inv>0) P.inv--;
  P.anim += Math.abs(P.vx)*.22 + .04;
  P.state = !P.onGround ? (P.vy<0?'jump':'fall')
          : (Math.abs(P.vx)>.4 ? 'run' : (IN.down?'crouch':'idle'));
}

function damage(force){
  if(P.inv>0) return;
  if(P.power > 0){
    setPower(P.power - 1); P.inv = G.invT || 110; SFX.hurt(); updateHUD();
    popText(P.x, P.y-6, POWER_NAME[P.power]);
    freeze(8); G.shakeT = 8; buzz([30,40,30]);
    for(let i=0;i<14;i++) G.parts.push({x:P.x+7,y:P.y+12,
      vx:(Math.random()-.5)*7, vy:(Math.random()-.5)*7, life:26, c:'#ffd23f', s:3});
  } else loseLife(false);
}
function loseLife(silent){
  if(!P.alive) return;
  P.alive = false; P.vy = -9; P.deadT = 0; P.combo = 0; musicStop();
  freeze(12); buzz([50,60,50]);
  if(!silent) SFX.die();
}
function respawn(){
  G.lives--;
  updateHUD();
  if(G.lives<0){ showGameOver(); return; }
  resetPlayer(true);
  musicStart(G.meta.tune);
}

/* Труба переносить у підземну скарбницю і повертає назад */
function usePipe(kind, tx){
  const list = (G.meta && G.meta.pipes) || [];
  let dest = null;
  if(kind === 'd'){
    let best = null;
    for(const pp of list) if(best === null || Math.abs(pp.px - tx) < Math.abs(best.px - tx)) best = pp;
    if(best && best.roomX !== undefined){ dest = {x:(best.roomX + 3)*T, y:14*T - 4}; G.inRoom = 1; }
  } else {
    let best = null;
    for(const pp of list)
      if(pp.roomX !== undefined && tx >= pp.roomX && tx < pp.roomX + 46) best = pp;
    if(best){ dest = {x:best.backX*T, y:14*T - 4}; G.inRoom = 0; }
  }
  if(!dest) return;
  P.x = dest.x; P.y = dest.y; P.vx = 0; P.vy = 0; P.trail.length = 0;
  G.cam.x = P.x - VW*.46; G.flash = 16; freeze(6);
  SFX.power(); buzz(20);
  for(let i=0;i<16;i++) G.parts.push({x:P.x+7, y:P.y+16,
    vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6, life:26, c:'#5af0e0', s:3});
}

/* ── 10. СУТНОСТІ ─────────────────────────────────────────── */
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function updateEnts(){
  for(let i=G.ents.length-1;i>=0;i--){
    const e = G.ents[i];
    const far = Math.abs(e.x - (G.cam.x+VW/2)) > VW*1.2;

    if(e.t==='relic'){
      e.a += .07;
      if(P.alive && overlap(reachBox(), e)){
        G.gotRelics++; updateHUD(); addScore(2000); G.flash = 20; freeze(8); SFX.power(); buzz([20,50,20]);
        popText(e.x, e.y-8, 'РЕЛІКВІЯ ' + G.gotRelics + '/3', 120);
        for(let q=0;q<24;q++) G.parts.push({x:e.x+7,y:e.y+7,
          vx:(Math.random()-.5)*8, vy:(Math.random()-.5)*8, life:44, c:'#ffd23f', s:3});
        G.ents.splice(i,1);
      }
      continue;
    }
    if(e.t==='berry'){
      e.a += .12;
      if(P.alive){
        const dx=(P.x+P.w/2)-(e.x+6), dy=(P.y+P.h/2-4)-(e.y+6), d=Math.hypot(dx,dy)||1;
        if(d < (G.magnetR||58)) e.hook = 1;          // зачепив — уже не втече
        if(e.hook){ e.v = Math.min((e.v||3)+.8, 13); e.x += dx/d*e.v; e.y += dy/d*e.v; }
        if(d < 13 || overlap(reachBox(), e)){ collectBerry(e.x, e.y); G.ents.splice(i,1); }
      }
      continue;
    }
    if(e.t==='item'){
      if(e.rise>0){ e.y -= 1.2; e.rise -= 1.2; }
      else { e.vy += .4; e.hitWall=0; moveBody(e); if(e.hitWall) e.vx = -e.vx; if(e.onGround&&e.kind==='life') e.vy=-5; }
      if(P.alive && overlap(reachBox(), e)){
        if(e.kind==='charge'){
          if(P.power < 2){ setPower(P.power + 1); popText(e.x, e.y-8, POWER_NAME[P.power]); }
          addScore(1000); G.flash = 12; freeze(6);
        }
        else { G.lives++; addScore(0); popText(e.x,e.y,'+1 ЖИТТЯ'); }
        SFX.power(); updateHUD(); G.ents.splice(i,1);
      }
      continue;
    }
    if(e.t==='bolt'){
      e.x += e.vx; e.life--; e.a += .5;
      for(let k=0;k<2;k++) G.parts.push({x:e.x+5,y:e.y+3,vx:(Math.random()-.5)*1.5,
        vy:(Math.random()-.5)*1.5, life:12, c:'#5af0e0', s:2});
      const hx = e.x + (e.vx>0 ? e.w : 0), hy = e.y + 3;
      const hc = tileAt(hx, hy);
      if(hc === 'B' && P.power > 0){                 // цегла розлітається від розряду
        const tx2 = Math.floor(hx/T), ty2 = Math.floor(hy/T);
        if(G.grid[ty2]) G.grid[ty2][tx2] = '.';
        G.bumps.push({x:tx2, y:ty2, t:8});
        for(let q=0;q<9;q++) G.parts.push({x:tx2*T+10, y:ty2*T+10,
          vx:(Math.random()-.5)*6, vy:-Math.random()*5-1, life:32, c:G.theme.brick, s:4});
        addScore(50); SFX.brick(); G.shakeT = Math.max(G.shakeT,3);
        G.ents.splice(i,1); P.bolts = Math.max(0,P.bolts-1); continue;
      }
      if(e.life<=0 || isSolid(hc)){ G.ents.splice(i,1); P.bolts=Math.max(0,P.bolts-1); continue; }
      for(const o of G.ents){
        if(!'crawler spiky flyer jumper bird ghost boss'.includes(o.t) || !o.alive) continue;
        if(overlap(e,o)){
          if(o.t==='boss') bossHit(o); else killEnemy(o, true);
          G.ents.splice(i,1); P.bolts = Math.max(0,P.bolts-1); break;
        }
      }
      continue;
    }
    if(e.t==='plat'){
      e.ph += .018;
      const nx = e.vert ? e.ox : e.ox + Math.sin(e.ph)*66;
      const ny = e.vert ? e.oy + Math.sin(e.ph)*70 : e.oy;
      e.dx = nx-e.x; e.dy = ny-e.y; e.x = nx; e.y = ny;
      continue;
    }
    if(e.t==='dog'){                          // біжить своєю дорогою і зникає
      e.vy = Math.min(e.vy + PH.grav, PH.maxFall);
      e.vx = -3.2;                                    // стіна її не спиняє
      e.hitWall = 0; e.anim += .35;
      moveBody(e);
      if(e.hitWall && e.onGround) e.vy = -8.6;        // перестрибує перешкоди
      e.vx = -3.2;
      e.life--;
      if(e.life <= 0 || e.x < G.cam.x - 260 || e.y > G.H*T){ G.ents.splice(i,1); continue; }
      if(P.alive && !P.winT && overlap(P,e)) damage(false);
      continue;
    }
    if(e.t==='icicle'){                       // бурулька зривається, коли ти під нею
      if(e.state===0){
        if(Math.abs((P.x+P.w/2)-(e.x+e.w/2)) < 34 && P.y > e.y){ e.state=1; e.timer=26; }
      } else if(e.state===1){
        e.timer--; if(e.timer<=0){ e.state=2; e.vy=0; }
      } else {
        e.vy = Math.min((e.vy||0)+.55, 12); e.y += e.vy;
        if(isSolid(tileAt(e.x+6, e.y+e.h+2)) || e.y > G.H*T){
          for(let k=0;k<10;k++) G.parts.push({x:e.x+6,y:e.y+e.h,
            vx:(Math.random()-.5)*5, vy:-Math.random()*4, life:22, c:'#cfe2f0', s:3});
          SFX.brick(); G.ents.splice(i,1); continue;
        }
        if(P.alive && !P.winT && overlap(P,e)) damage(false);
      }
      continue;
    }
    if(e.t==='updraft'){                      // потік підіймає, поки ти в ньому
      e.ph += .12;
      if(P.alive && overlap(P,e) && !P.winT){
        P.vy = Math.max(P.vy - .82, -5.2);
        if(G.frames%4===0) G.parts.push({x:e.x+2+Math.random()*(e.w-4), y:e.y+e.h-4,
          vx:0, vy:-2.4, life:26, c:'rgba(160,255,220,.8)', s:2, soft:1});
      }
      continue;
    }
    if(e.t==='geyser'){                       // гейзер бʼє за розкладом
      e.timer++;
      const cyc = 250, warn = 62, blow = 34, ph = e.timer % cyc;
      e.hot = ph > cyc-blow ? 1 : 0;
      e.warn = (ph > cyc-blow-warn && !e.hot) ? 1 : 0;
      if(e.hot){
        const col = {x:e.x+5, y:e.y-4*T, w:T-10, h:5*T};   // стовп вужчий за вигляд
        if(P.alive && !P.winT && overlap(P,col)) damage(false);
        if(G.frames%3===0) G.parts.push({x:e.x+10, y:e.y,
          vx:(Math.random()-.5)*2, vy:-6-Math.random()*3, life:26, c:'#ff8a3a', s:3});
      } else if(e.warn && G.frames%6===0){
        G.parts.push({x:e.x+10, y:e.y+8, vx:(Math.random()-.5)*1.5, vy:-1.4,
          life:20, c:'#ffb03a', s:2, soft:1});
      }
      continue;
    }
    if(e.t==='wave'){
      e.x += e.vx; e.life--; e.a=(e.a||0)+.3;
      if(e.life<=0){ G.ents.splice(i,1); continue; }
      if(P.alive && !P.winT && overlap(P,e)) damage(false);
      continue;
    }
    if(e.squash>0){ e.squash--; if(e.squash===0) G.ents.splice(i,1); continue; }
    if(!e.alive) continue;
    if(far && e.t!=='boss') continue;             // економимо на далеких ворогах

    /* --- вороги --- */
    if(e.t==='crawler' || e.t==='spiky'){
      e.hitWall = 0; e.vy = Math.min(e.vy+PH.grav, PH.maxFall);
      moveBody(e);
      if(e.still){ e.anim += .08; e.dir = Math.sin(e.anim)>0?1:-1; }
      if(e.hitWall) e.vx = -e.vx;
      // не падати з краю
      if(e.onGround){
        const ahead = e.x + (e.vx>0 ? e.w+2 : -2);
        if(!isSolid(tileAt(ahead, e.y+e.h+3)) && tileAt(ahead,e.y+e.h+3)!=='-') e.vx = -e.vx;
      }
      e.dir = Math.sign(e.vx) || e.dir;
      e.anim += Math.abs(e.vx)*.3;
    }
    else if(e.t==='ghost'){                    // сором'язливий: завмирає, коли дивишся на нього
      e.ph += .05; e.anim += .06;
      const dx2 = (P.x - e.x), dy2 = (P.y - e.y);
      const d2 = Math.hypot(dx2,dy2) || 1;
      const looked = (dx2 > 0 && P.dir < 0) || (dx2 < 0 && P.dir > 0);
      e.shy = looked ? Math.min(1,(e.shy||0)+.12) : Math.max(0,(e.shy||0)-.08);
      // полює лише поки ти поруч; відірвався — привид тане і зникає
      if(d2 > 400){ e.fade = (e.fade||0) + .02; }
      else { e.fade = Math.max(0, (e.fade||0) - .03);
             if(!looked){ e.x += dx2/d2*.55; e.y += dy2/d2*.42; } }
      if(e.fade >= 1){ G.ents.splice(i,1); continue; }
      e.dir = dx2 > 0 ? 1 : -1;
    }
    else if(e.t==='bird'){                     // птах летить рівно і швидко
      if(!e.woke){
        if(Math.abs(e.x-(P.x+P.w/2)) > 170) e.woke = 1; else { e.anim += .2; continue; }
      }
      e.x += e.vx; e.anim += .3;
      e.y = e.y0 + Math.sin(e.anim*.35)*10;
      e.dir = Math.sign(e.vx);
    }
    else if(e.t==='flyer'){
      if(!e.woke){
        if(Math.abs(e.x - (P.x+P.w/2)) > 150) e.woke = 1; else { e.anim += .16; continue; }
      }
      e.x += e.vx; e.anim += .16;
      e.y = e.y0 + Math.sin(e.anim*.5)*26;
      if(isSolid(tileAt(e.x+(e.vx>0?e.w:0), e.y+e.h/2))) e.vx = -e.vx;
      e.dir = Math.sign(e.vx);
    }
    else if(e.t==='jumper'){
      e.vy = Math.min(e.vy+PH.grav, PH.maxFall);
      e.timer--;
      if(e.onGround && e.timer<=0){
        e.vy = -8.2; e.vx = (P.x>e.x?1:-1)*1.45; e.timer = 66;
      }
      if(e.onGround && e.timer>0) e.vx *= .82;
      e.hitWall = 0; moveBody(e);
      if(e.hitWall) e.vx = -e.vx;
      e.anim += .12;
    }
    else if(e.t==='boss'){ updateBoss(e); }

    if(P.alive && !P.winT && overlap(P,e)) touchEnemy(e);
    if(e.y > G.H*T+60) G.ents.splice(i,1);
  }
}

function touchEnemy(e){
  if(e.t === 'ghost' && e.shy > .5) return;   // поки дивишся — він безпечний
  const stompable = e.t==='crawler' || e.t==='flyer' || e.t==='jumper' || e.t==='bird' || e.t==='boss';
  const falling = P.vy>1.2 && (P.y + P.h - P.vy) <= e.y + 8;
  if(stompable && falling){
    if(e.t==='boss'){ bossHit(e); P.vy = PH.bounce; return; }
    killEnemy(e,false);
    P.vy = IN.up ? PH.bounce*1.25 : PH.bounce;
  } else damage(false);
}
/* Репліки, які ворог кидає, зникаючи. Без паузи, просто в кадрі.
   Колода тасується і роздається без повторів — поки не вийдуть усі. */
const DEATH_LINES = [
  'Не виноватая я!', 'Птичку жалко...', 'Ку!', 'Замуровали, демоны!',
  'Шеф, всё пропало!', 'Огласите весь список!', 'Танцуют все!',
  'Пилите, Шура, пилите', 'Муля, не нервируй меня', 'Будем искать',
  'Спокойствие, только спокойствие', 'Я не трус!', 'Кемска волость?',
  'Жить хорошо!', 'Ласточка моя!', 'Бамбарбия! Кергуду!',
  'Короче, Склифосовский!', 'Чей туфля?', 'Лёгким движением руки...',
  'Икра заморская, баклажанная', 'Всё, кина не будет', 'Помедленнее, я записываю',
  'Аз есмь царь!', 'Житие мое...', 'Свободу Юрию Деточкину!',
  'Береги руку, Сеня!', 'Комсомолка, спортсменка, красавица!',
  'Я требую продолжения банкета!', 'Профессор, конечно, лопух',
  'А компот?', 'Красота какая! Лепота!', 'Тепленькая пошла!',
  'Пошто боярыню обидел?', 'Меня терзают смутные сомнения',
  'Царь, очень приятно, царь', 'Ну, граждане алкоголики',
  'Хорошо сидим!', 'Тамбовский волк тебе товарищ', 'Разруха в головах',
  'Ну и рожа у тебя!', 'Куда, Илья Муромец?', 'Огурчик хочешь?',
  'Я вам денежки принёс', 'Собака — друг человека', 'Такова се ля ви'
];
let lineDeck = [];
function nextLine(){
  if(!lineDeck.length){                      // колода скінчилась — тасуємо заново
    lineDeck = DEATH_LINES.slice();
    for(let i=lineDeck.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [lineDeck[i], lineDeck[j]] = [lineDeck[j], lineDeck[i]];
    }
  }
  return lineDeck.pop();
}
/* Кожен ворог говорить. Якщо їх кілька поруч — репліки стають одна над одною. */
function enemyLine(x, y){
  let said = 0;
  for(const q of G.pops) if(q.say) said++;
  if(said >= 5) return;                      // більше пʼяти в кадрі — вже галас
  let ny = y;
  for(let tries = 0; tries < 4; tries++){
    let clash = false;
    for(const q of G.pops)
      if(q.say && Math.abs(q.x - x) < 90 && Math.abs(q.y - ny) < 17){ clash = true; break; }
    if(!clash) break;
    ny -= 18;                                // піднімаємо, щоб не накладались
  }
  G.pops.push({x, y:ny, s:nextLine(), t:104, big:1, say:1});
}
const COMBO = [100,200,400,800,1600,2400];
function killEnemy(e, byBolt){
  e.alive = false; e.squash = byBolt ? 1 : 22;
  let pts = 150, label;
  if(byBolt){ label = '+150'; }
  else {
    P.combo++;
    if(P.combo >= 7){ G.lives++; pts = 0; label = '+1 ЖИТТЯ'; SFX.power(); updateHUD(); }
    else { pts = COMBO[Math.min(P.combo-1, COMBO.length-1)];
           label = (P.combo>1? '×'+P.combo+'  ':'') + '+' + pts; }
    freeze(4); G.shakeT = Math.max(G.shakeT, 3); buzz(14);
    dust(e.x+8, e.y+e.h, 6, '#ffd23f');
  }
  addScore(pts); popText(e.x, e.y, label);
  enemyLine(e.x + e.w/2, e.y - 10);
  SFX.stomp();
  if(byBolt) for(let i=0;i<12;i++) G.parts.push({x:e.x+8,y:e.y+8,
    vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6, life:24, c:'#ffd23f', s:3});
}

/* --- бос --- */
function updateBoss(b){
  if(!G.bossActive){ b.vy = Math.min(b.vy+PH.grav, PH.maxFall); moveBody(b); return; }
  if(b.hurt>0) b.hurt--;
  b.anim += .1;
  b.vy = Math.min(b.vy+PH.grav*.9, PH.maxFall);
  b.timer--;
  if(b.onGround){
    b.vx *= b.hurt>18 ? .72 : .84;
    if(b.timer<=0 && b.hurt<=18){
      const d = Math.sign(P.x - b.x) || 1;
      b.vx = d*(1.5 + (6-b.hp)*.18); b.vy = -9.2; b.dir = d;
      b.timer = Math.max(36, 76 - (6-b.hp)*5);
      b.jumping = true;
    }
  }
  const wasAir = !b.onGround;
  b.hitWall = 0; moveBody(b);
  if(b.hitWall) b.vx = -b.vx*.5;
  const lo = G.camMin + 4, hi = (G.W-3)*T - b.w;
  if(b.x < lo){ b.x = lo; b.vx = Math.abs(b.vx); }
  if(b.x > hi){ b.x = hi; b.vx = -Math.abs(b.vx); }
  if(b.onGround && wasAir && b.jumping){
    b.jumping = false; G.shakeT = 14; SFX.boss();
    const speeds = b.hp<=2 ? [-3.2,-2.5,2.5,3.2] : [-2.5,2.5];
    for(const v of speeds) G.ents.push({t:'wave', x:b.x+b.w/2, y:b.y+b.h-14,
      w:14, h:14, vx:v, life:64, a:0});
    for(let i=0;i<14;i++) G.parts.push({x:b.x+b.w/2, y:b.y+b.h,
      vx:(Math.random()-.5)*8, vy:-Math.random()*4, life:26, c:'#8f96b8', s:3});
  }
}
function bossHit(b){
  if(b.hurt>0) return;
  b.hp--; b.hurt = 30; G.shakeT = 10; SFX.hit(); freeze(6); buzz(24);
  b.vx = Math.sign(b.x - P.x || 1) * 2.4; b.timer = 26;
  P.inv = Math.max(P.inv, 46);
  addScore(500); popText(b.x+10, b.y, '+500');
  for(let i=0;i<18;i++) G.parts.push({x:b.x+b.w/2, y:b.y+b.h/2,
    vx:(Math.random()-.5)*9, vy:(Math.random()-.5)*9, life:30, c:'#ff4d4d', s:4});
  if(b.hp<=0){
    b.alive = false; b.squash = 60; G.bossDead = true; G.shakeT = 26; G.flash = 26;
    enemyLine(b.x + b.w/2, b.y - 16);
    addScore(3000); popText(b.x, b.y-10, '+3000');
    const [gx,gy1,gy2] = G.meta.goalAt;
    for(let y=gy1;y<=gy2;y++) put(G.grid,gx,y,'G');
    G.goalOpen = true; G.camMin = 0;
    // маяк може зʼявитись позаду — показуємо це стовпом іскор і підписом
    popText(gx*T + 10, gy1*T - 6, 'МАЯК ВІДКРИТО', 150);
    for(let y=gy1;y<=gy2+1;y++)
      for(let k=0;k<5;k++) G.parts.push({x:gx*T+10, y:y*T+10,
        vx:(Math.random()-.5)*3, vy:-Math.random()*3, life:60, c:'#5af0e0', s:3});
    for(let i=0;i<40;i++) G.parts.push({x:b.x+b.w/2, y:b.y+b.h/2,
      vx:(Math.random()-.5)*12, vy:(Math.random()-.5)*12, life:50, c:'#ffd23f', s:4});
  }
}

/* Вівчарка. Один раз за рівень. Убити не можна — тільки перестрибнути. */
function updateDog(){
  if(G.inRoom || !P.alive || P.winT) return;
  const gate = G.dogDone === 0 ? G.dogAt : (G.dogDone === 1 ? G.dogAt2 : Infinity);
  if(G.dogDone < 2 && !G.dogWarn && P.x > gate){
    G.dogWarn = 85;
    popText(P.x + 40, P.y - 24, 'ОБЕРЕЖНО — ПЕС!', 90);
    SFX.hurt(); buzz([25,40,25]);
  }
  if(G.dogWarn > 0 && --G.dogWarn === 0){
    G.dogDone++;
    G.ents.push({t:'dog', x: P.x + VW*0.85, y: 14*T - 4, w:26, h:18,
                 vx:-3.2, vy:0, anim:0, alive:true, life:900});
    noise(.2,.09); tone(160,.18,'sawtooth',.06,-60);
  }
}

/* Фірмова механіка континенту, що діє на весь рівень */
function updateMech(){
  if(G.inRoom) return;                    // під землею немає ані вітру, ані блискавок
  const m = G.meta && G.meta.mech;
  if(m === 'wind'){                       // Африка: пилові пориви
    const cc = G.frames % 420;
    if(cc === 0) G.windDir = Math.random() < .5 ? -1 : 1;
    G.wind = (cc > 150 && cc < 300) ? (G.windDir || 1) * (1 - Math.abs(cc-225)/75) : 0;
    if(G.wind && P.alive && !P.winT){
      P.vx += G.wind * (P.onGround ? .05 : .13);
      if(Math.abs(P.vx) > PH.maxRun*1.25) P.vx = Math.sign(P.vx)*PH.maxRun*1.25;
    }
  } else if(m === 'strike'){              // Японія: блискавка з попередженням
    G.strikeT = (G.strikeT || 0) + 1;
    if(!G.strikeX && G.strikeT > 340){
      G.strikeX = Math.round((P.x + 95 + Math.random()*170) / T) * T;
      G.strikeT = 0; G.strikeWarn = 62;
    }
    if(G.strikeX){
      if(G.strikeWarn > 0){
        G.strikeWarn--;
        if(G.strikeWarn === 0){ G.strikeHit = 12; SFX.bolt(); G.shakeT = 8; }
      } else if(G.strikeHit > 0){
        G.strikeHit--;
        if(P.alive && !P.winT && Math.abs((P.x+P.w/2) - (G.strikeX+T/2)) < T*.45) damage(false);
        if(G.strikeHit === 0){ G.strikeX = 0; G.strikeT = 0; }
      }
    }
  }
}
